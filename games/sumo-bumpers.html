<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sumo Bumpers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #gameCanvas {
            border: 4px solid #2d3748;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(251, 191, 36, 0.1);
            background: linear-gradient(180deg, #87ceeb 0%, #e0f6ff 100%);
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            font-size: 24px;
            z-index: 10;
            text-align: center;
        }

        #scoreBoard {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .playerScore {
            padding: 8px 16px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.6);
            font-size: 16px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .playerScore.leading {
            border-color: #fbbf24;
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.4);
        }

        #lobbyScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        #lobbyScreen h1 {
            font-size: 72px;
            margin-bottom: 10px;
            color: #fbbf24;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.8), 0 0 40px rgba(251, 191, 36, 0.3);
            letter-spacing: 4px;
        }

        .subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .playerSlot {
            padding: 20px 40px;
            margin: 10px;
            border-radius: 15px;
            font-size: 24px;
            min-width: 400px;
            text-align: center;
            border: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .playerSlot.waiting {
            background: rgba(100, 100, 100, 0.3);
            border-color: #444;
        }

        .playerSlot.ready {
            border-color: white;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 rgba(255,255,255,0); }
            50% { transform: scale(1.03); box-shadow: 0 0 20px rgba(255,255,255,0.2); }
        }

        #startButton {
            margin-top: 40px;
            padding: 20px 60px;
            font-size: 32px;
            font-weight: bold;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1f2937;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
            box-shadow: 0 8px 25px rgba(251, 191, 36, 0.3);
        }

        #startButton:hover {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            transform: scale(1.08);
            box-shadow: 0 12px 35px rgba(251, 191, 36, 0.4);
        }

        #winnerScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        #winnerScreen h1 {
            font-size: 64px;
            margin-bottom: 20px;
            animation: celebrate 0.5s ease-in-out infinite alternate;
        }

        @keyframes celebrate {
            from { transform: scale(1) rotate(-2deg); }
            to { transform: scale(1.1) rotate(2deg); }
        }

        .winnerStats {
            font-size: 18px;
            margin: 20px 0;
            color: rgba(255,255,255,0.7);
        }

        #winnerScreen button {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 24px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
        }

        #winnerScreen button:hover {
            background: linear-gradient(135deg, #059669, #047857);
            transform: scale(1.08);
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 13px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 25px;
            border-radius: 10px;
            text-align: center;
            max-width: 90%;
            backdrop-filter: blur(4px);
        }

        .backButton {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            z-index: 1000;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .backButton:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: scale(1.05);
            border-color: rgba(255,255,255,0.3);
        }

        canvas {
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>
    <a href="../index.html" class="backButton">← Gallery</a>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <div id="ui">
            <div id="roundInfo">Round 1/5</div>
            <div id="scoreBoard"></div>
        </div>

        <div id="lobbyScreen">
            <h1>SUMO BUMPERS</h1>
            <div class="subtitle">BUMP YOUR OPPONENTS OFF THE ARENA</div>
            <div id="playerSlots"></div>
            <button id="startButton">START GAME</button>
            <div style="margin-top: 40px; font-size: 18px; opacity: 0.7;">
                Connect gamepads or use keyboard to join!
            </div>
        </div>

        <div id="winnerScreen">
            <h1 id="winnerText"></h1>
            <div class="winnerStats" id="winnerStats"></div>
            <button onclick="location.reload()">Play Again</button>
        </div>

        <div id="controls">
            <strong>Keyboard Controls:</strong><br>
            Player 1: WASD + Q (Dash) + E (Brake) | Player 2: Arrows + . (Dash) + / (Brake)<br>
            <strong>Gamepad:</strong> Left Stick (Move) + A (Dash) + B (Brake)
        </div>
    </div>

    <script>
        const DEBUG = false;

        if (!DEBUG) {
            const noop = () => {};
            console.log = noop;
            console.warn = noop;
            console.info = noop;
        }

        class EventManager {
            constructor() {
                this.listeners = [];
            }

            add(element, event, handler, options) {
                element.addEventListener(event, handler, options);
                this.listeners.push({ element, event, handler, options });
            }

            removeAll() {
                this.listeners.forEach(({ element, event, handler, options }) => {
                    element.removeEventListener(event, handler, options);
                });
                this.listeners = [];
            }
        }

        function safeGetItem(key, defaultValue = null) {
            try {
                const item = localStorage.getItem(key);
                return item !== null ? item : defaultValue;
            } catch (error) {
                console.error('LocalStorage not available:', error);
                return defaultValue;
            }
        }

        function safeSetItem(key, value) {
            try {
                localStorage.setItem(key, value);
                return true;
            } catch (error) {
                console.error('LocalStorage not available:', error);
                return false;
            }
        }

        function initCanvas() {
            const canvas = document.getElementById('gameCanvas');
            if (!canvas) {
                console.error('Canvas element not found');
                return null;
            }

            const ctx = canvas.getContext('2d');
            if (!ctx) {
                console.error('Canvas 2D context not available');
                return null;
            }

            return { canvas, ctx };
        }

        const canvasSetup = initCanvas();
        if (!canvasSetup) {
            alert('Your browser does not support Canvas. Please use a modern browser.');
            throw new Error('Canvas not supported');
        }

        const { canvas, ctx } = canvasSetup;
        const eventManager = new EventManager();

        const CANVAS_WIDTH = 1000;
        const CANVAS_HEIGHT = 800;
        const ARENA_RADIUS = 300;
        const PLAYER_RADIUS = 25;
        const DASH_SPEED = 12;
        const NORMAL_SPEED = 7;
        const FRICTION = 0.92;
        const DASH_COOLDOWN = 45;
        const MAX_ROUNDS = 5;

        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        const PLAYER_COLORS = [
            { main: '#ef4444', dark: '#991b1b', light: '#fca5a5', glow: 'rgba(239, 68, 68, 0.4)' },
            { main: '#3b82f6', dark: '#1e3a8a', light: '#93c5fd', glow: 'rgba(59, 130, 246, 0.4)' },
            { main: '#22c55e', dark: '#14532d', light: '#86efac', glow: 'rgba(34, 197, 94, 0.4)' },
            { main: '#f59e0b', dark: '#78350f', light: '#fcd34d', glow: 'rgba(245, 158, 11, 0.4)' }
        ];

        let gameState = 'lobby';
        let currentRound = 1;
        let arenaRadius = ARENA_RADIUS;
        let targetArenaRadius = ARENA_RADIUS;
        let players = [];
        let particles = [];
        let screenShake = { x: 0, y: 0, intensity: 0 };
        let connectedGamepads = new Map();
        let roundTransitionTimer = 0;
        let roundTransitionText = '';
        let arenaRotation = 0;

        class Player {
            constructor(id, color, controls) {
                this.id = id;
                this.color = color;
                this.controls = controls;
                this.reset();
                this.score = 0;
                this.alive = true;
                this.trailPositions = [];
                this.hitFlash = 0;
            }

            reset() {
                const angle = (Math.PI * 2 * this.id) / 4;
                const spawnRadius = arenaRadius * 0.5;
                this.x = CANVAS_WIDTH / 2 + Math.cos(angle) * spawnRadius;
                this.y = CANVAS_HEIGHT / 2 + Math.sin(angle) * spawnRadius;
                this.vx = 0;
                this.vy = 0;
                this.radius = PLAYER_RADIUS;
                this.dashCooldown = 0;
                this.alive = true;
                this.wobble = 0;
                this.trailPositions = [];
                this.hitFlash = 0;
                this.scaleAnim = 0;
            }

            update() {
                if (!this.alive) return;

                const input = this.getInput();

                if (input.brake) {
                    this.vx *= 0.7;
                    this.vy *= 0.7;
                }

                if (input.dx !== 0 || input.dy !== 0) {
                    const isDashing = input.dash && this.dashCooldown === 0;
                    const speed = isDashing ? DASH_SPEED : NORMAL_SPEED;
                    const accel = isDashing ? 0.8 : 0.5;
                    this.vx += input.dx * speed * accel;
                    this.vy += input.dy * speed * accel;

                    if (isDashing) {
                        this.dashCooldown = DASH_COOLDOWN;
                        this.createDashParticles();
                        addScreenShake(3);
                    }
                }

                this.vx *= FRICTION;
                this.vy *= FRICTION;

                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                const maxSpeed = 15;
                if (speed > maxSpeed) {
                    this.vx = (this.vx / speed) * maxSpeed;
                    this.vy = (this.vy / speed) * maxSpeed;
                }

                this.x += this.vx;
                this.y += this.vy;

                // Trail
                if (speed > 2) {
                    this.trailPositions.push({ x: this.x, y: this.y, life: 15 });
                }
                this.trailPositions = this.trailPositions.filter(t => {
                    t.life--;
                    return t.life > 0;
                });
                if (this.trailPositions.length > 20) this.trailPositions.shift();

                const dx = this.x - CANVAS_WIDTH / 2;
                const dy = this.y - CANVAS_HEIGHT / 2;
                const distFromCenter = Math.sqrt(dx * dx + dy * dy);

                if (distFromCenter + this.radius > arenaRadius) {
                    if (distFromCenter + this.radius > arenaRadius - 20) {
                        this.wobble = Math.sin(Date.now() * 0.02) * 5;
                    }

                    if (distFromCenter > arenaRadius + this.radius) {
                        this.alive = false;
                        this.createDeathParticles();
                        addScreenShake(8);
                        return;
                    }

                    const angle = Math.atan2(dy, dx);
                    const overlap = distFromCenter + this.radius - arenaRadius;
                    this.x -= Math.cos(angle) * overlap;
                    this.y -= Math.sin(angle) * overlap;

                    this.vx += Math.cos(angle) * 0.5;
                    this.vy += Math.sin(angle) * 0.5;
                } else {
                    this.wobble = 0;
                }

                if (this.dashCooldown > 0) this.dashCooldown--;
                if (this.hitFlash > 0) this.hitFlash--;
                if (this.scaleAnim > 0) this.scaleAnim *= 0.9;
            }

            getInput() {
                const input = { dx: 0, dy: 0, dash: false, brake: false };

                if (this.controls.gamepadIndex !== undefined) {
                    const gamepad = navigator.getGamepads()[this.controls.gamepadIndex];
                    if (gamepad) {
                        input.dx = gamepad.axes[0];
                        input.dy = gamepad.axes[1];
                        input.dash = gamepad.buttons[0].pressed;
                        input.brake = gamepad.buttons[1].pressed;

                        if (Math.abs(input.dx) < 0.15) input.dx = 0;
                        if (Math.abs(input.dy) < 0.15) input.dy = 0;
                    }
                }

                if (this.controls.keys) {
                    if (keys[this.controls.keys.up]) input.dy -= 1;
                    if (keys[this.controls.keys.down]) input.dy += 1;
                    if (keys[this.controls.keys.left]) input.dx -= 1;
                    if (keys[this.controls.keys.right]) input.dx += 1;
                    if (keys[this.controls.keys.dash]) input.dash = true;
                    if (keys[this.controls.keys.brake]) input.brake = true;
                }

                if (input.dx !== 0 && input.dy !== 0) {
                    const mag = Math.sqrt(input.dx * input.dx + input.dy * input.dy);
                    input.dx /= mag;
                    input.dy /= mag;
                }

                return input;
            }

            createDashParticles() {
                for (let i = 0; i < 15; i++) {
                    particles.push(new Particle(
                        this.x - this.vx * 0.5 + (Math.random() - 0.5) * 10,
                        this.y - this.vy * 0.5 + (Math.random() - 0.5) * 10,
                        -this.vx * 0.3 + (Math.random() - 0.5) * 4,
                        -this.vy * 0.3 + (Math.random() - 0.5) * 4,
                        this.color.light,
                        25 + Math.random() * 10,
                        3 + Math.random() * 2
                    ));
                }
            }

            createDeathParticles() {
                for (let i = 0; i < 40; i++) {
                    const angle = (Math.PI * 2 * i) / 40;
                    const speed = 3 + Math.random() * 5;
                    particles.push(new Particle(
                        this.x,
                        this.y,
                        Math.cos(angle) * speed,
                        Math.sin(angle) * speed,
                        i % 2 === 0 ? this.color.main : this.color.light,
                        40 + Math.random() * 20,
                        2 + Math.random() * 4
                    ));
                }
                // Ring burst
                for (let i = 0; i < 20; i++) {
                    const angle = (Math.PI * 2 * i) / 20;
                    particles.push(new Particle(
                        this.x + Math.cos(angle) * this.radius,
                        this.y + Math.sin(angle) * this.radius,
                        Math.cos(angle) * 2,
                        Math.sin(angle) * 2,
                        '#ffffff',
                        20,
                        1.5
                    ));
                }
            }

            draw() {
                if (!this.alive) return;

                // Trail
                this.trailPositions.forEach((t, i) => {
                    const alpha = (t.life / 15) * 0.3;
                    ctx.fillStyle = this.color.main;
                    ctx.globalAlpha = alpha;
                    ctx.beginPath();
                    const trailSize = this.radius * (t.life / 15) * 0.6;
                    ctx.arc(t.x, t.y, trailSize, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1;

                ctx.save();
                const scale = 1 + this.scaleAnim * 0.15;
                ctx.translate(this.x + this.wobble, this.y);
                ctx.scale(scale, scale);

                // Glow
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > 5) {
                    const glowRadius = this.radius + 8 + speed;
                    const glow = ctx.createRadialGradient(0, 0, this.radius, 0, 0, glowRadius);
                    glow.addColorStop(0, this.color.glow);
                    glow.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(0, 0, glowRadius, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.beginPath();
                ctx.ellipse(0, this.radius + 8, this.radius * 0.8, this.radius * 0.25, 0, 0, Math.PI * 2);
                ctx.fill();

                // Outer ring
                ctx.fillStyle = this.color.dark;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius + 2, 0, Math.PI * 2);
                ctx.fill();

                // Main body
                const bodyGrad = ctx.createRadialGradient(-5, -5, 0, 0, 0, this.radius);
                bodyGrad.addColorStop(0, this.hitFlash > 0 ? '#ffffff' : this.color.light);
                bodyGrad.addColorStop(0.6, this.color.main);
                bodyGrad.addColorStop(1, this.color.dark);
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.arc(0, -2, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // Highlight
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.beginPath();
                ctx.arc(-this.radius * 0.3, -this.radius * 0.35, this.radius * 0.25, 0, Math.PI * 2);
                ctx.fill();

                // Eyes
                const eyeOffset = speed > 5 ? 2 : 0;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(-7, -2, 6, 0, Math.PI * 2);
                ctx.arc(7, -2, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#1f2937';
                ctx.beginPath();
                ctx.arc(-6 + eyeOffset, -1, 3, 0, Math.PI * 2);
                ctx.arc(8 + eyeOffset, -1, 3, 0, Math.PI * 2);
                ctx.fill();

                // Mouth - angry when dashing
                if (this.dashCooldown > DASH_COOLDOWN - 10) {
                    ctx.strokeStyle = '#1f2937';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 4, 6, 0, Math.PI);
                    ctx.stroke();
                }

                // Dash cooldown ring
                if (this.dashCooldown > 0) {
                    const progress = 1 - this.dashCooldown / DASH_COOLDOWN;
                    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius + 6, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * progress);
                    ctx.stroke();
                }

                // Player number
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = 'bold 10px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('P' + (this.id + 1), 0, 14);

                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, vx, vy, color, life, size = 3) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.life = life;
                this.maxLife = life;
                this.size = size;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.15;
                this.vx *= 0.98;
                this.life--;
            }

            draw() {
                const alpha = this.life / this.maxLife;
                const size = this.size * alpha;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        function addScreenShake(intensity) {
            screenShake.intensity = Math.max(screenShake.intensity, intensity);
        }

        function updateScreenShake() {
            if (screenShake.intensity > 0) {
                screenShake.x = (Math.random() - 0.5) * screenShake.intensity * 2;
                screenShake.y = (Math.random() - 0.5) * screenShake.intensity * 2;
                screenShake.intensity *= 0.85;
                if (screenShake.intensity < 0.5) {
                    screenShake.intensity = 0;
                    screenShake.x = 0;
                    screenShake.y = 0;
                }
            }
        }

        const keys = {};

        function handleKeyDown(e) {
            keys[e.key] = true;
        }

        function handleKeyUp(e) {
            keys[e.key] = false;
        }

        function handleGamepadConnected(e) {
            console.log('Gamepad connected:', e.gamepad.id);
            connectedGamepads.set(e.gamepad.index, e.gamepad);
            updateLobby();
        }

        function handleGamepadDisconnected(e) {
            console.log('Gamepad disconnected:', e.gamepad.id);
            connectedGamepads.delete(e.gamepad.index);
            updateLobby();
        }

        function checkCollisions() {
            for (let i = 0; i < players.length; i++) {
                for (let j = i + 1; j < players.length; j++) {
                    const p1 = players[i];
                    const p2 = players[j];

                    if (!p1.alive || !p2.alive) continue;

                    const dx = p2.x - p1.x;
                    const dy = p2.y - p1.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const minDist = p1.radius + p2.radius;

                    if (dist < minDist) {
                        const angle = Math.atan2(dy, dx);
                        const sin = Math.sin(angle);
                        const cos = Math.cos(angle);

                        const vx1 = p1.vx * cos + p1.vy * sin;
                        const vy1 = p1.vy * cos - p1.vx * sin;
                        const vx2 = p2.vx * cos + p2.vy * sin;
                        const vy2 = p2.vy * cos - p2.vx * sin;

                        const temp = vx1;
                        const newVx1 = vx2 * 1.2;
                        const newVx2 = temp * 1.2;

                        p1.vx = newVx1 * cos - vy1 * sin;
                        p1.vy = vy1 * cos + newVx1 * sin;
                        p2.vx = newVx2 * cos - vy2 * sin;
                        p2.vy = vy2 * cos + newVx2 * sin;

                        const overlap = minDist - dist;
                        const separateX = (dx / dist) * overlap / 2;
                        const separateY = (dy / dist) * overlap / 2;
                        p1.x -= separateX;
                        p1.y -= separateY;
                        p2.x += separateX;
                        p2.y += separateY;

                        // Collision feedback
                        const impactSpeed = Math.abs(vx1 - vx2);
                        const impactX = (p1.x + p2.x) / 2;
                        const impactY = (p1.y + p2.y) / 2;

                        p1.hitFlash = 5;
                        p2.hitFlash = 5;
                        p1.scaleAnim = Math.min(1, impactSpeed * 0.1);
                        p2.scaleAnim = Math.min(1, impactSpeed * 0.1);

                        // Collision particles
                        const numParticles = Math.min(20, Math.floor(impactSpeed * 2));
                        for (let k = 0; k < numParticles; k++) {
                            const pAngle = Math.random() * Math.PI * 2;
                            const pSpeed = Math.random() * impactSpeed * 0.5 + 1;
                            particles.push(new Particle(
                                impactX,
                                impactY,
                                Math.cos(pAngle) * pSpeed,
                                Math.sin(pAngle) * pSpeed,
                                k % 3 === 0 ? '#ffffff' : (k % 2 === 0 ? p1.color.light : p2.color.light),
                                15 + Math.random() * 10,
                                1.5 + Math.random() * 2
                            ));
                        }

                        addScreenShake(Math.min(6, impactSpeed * 0.5));
                    }
                }
            }
        }

        function drawArena() {
            const centerX = CANVAS_WIDTH / 2;
            const centerY = CANVAS_HEIGHT / 2;

            // Background
            const bgGrad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, CANVAS_WIDTH * 0.6);
            bgGrad.addColorStop(0, '#c9e6f7');
            bgGrad.addColorStop(1, '#87a5be');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Abyss around arena
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.beginPath();
            ctx.arc(centerX, centerY + 15, arenaRadius + 30, 0, Math.PI * 2);
            ctx.fill();

            // Shadow under arena
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.beginPath();
            ctx.ellipse(centerX, centerY + 20, arenaRadius + 5, arenaRadius * 0.95, 0, 0, Math.PI * 2);
            ctx.fill();

            // Arena main body
            const arenaGradient = ctx.createRadialGradient(centerX - 30, centerY - 30, 0, centerX, centerY, arenaRadius);
            arenaGradient.addColorStop(0, '#fff7e0');
            arenaGradient.addColorStop(0.5, '#fde68a');
            arenaGradient.addColorStop(0.85, '#f59e0b');
            arenaGradient.addColorStop(1, '#d97706');
            ctx.fillStyle = arenaGradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, arenaRadius, 0, Math.PI * 2);
            ctx.fill();

            // Border
            ctx.strokeStyle = '#92400e';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.arc(centerX, centerY, arenaRadius, 0, Math.PI * 2);
            ctx.stroke();

            // Inner decorative rings
            ctx.strokeStyle = 'rgba(146, 64, 14, 0.15)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, arenaRadius * (0.3 + i * 0.2), 0, Math.PI * 2);
                ctx.stroke();
            }

            // Rotating decorative marks on outer ring
            arenaRotation += 0.003;
            ctx.strokeStyle = 'rgba(146, 64, 14, 0.2)';
            ctx.lineWidth = 3;
            for (let i = 0; i < 8; i++) {
                const a = arenaRotation + (Math.PI * 2 * i) / 8;
                const r1 = arenaRadius - 15;
                const r2 = arenaRadius - 5;
                ctx.beginPath();
                ctx.moveTo(centerX + Math.cos(a) * r1, centerY + Math.sin(a) * r1);
                ctx.lineTo(centerX + Math.cos(a) * r2, centerY + Math.sin(a) * r2);
                ctx.stroke();
            }

            // Danger zone indicator (edge glows red when arena is small)
            if (arenaRadius < ARENA_RADIUS - 30) {
                const dangerAlpha = 0.15 + Math.sin(Date.now() * 0.005) * 0.1;
                ctx.strokeStyle = `rgba(255, 0, 0, ${dangerAlpha})`;
                ctx.lineWidth = 12;
                ctx.beginPath();
                ctx.arc(centerX, centerY, arenaRadius - 3, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Center emblem
            ctx.fillStyle = 'rgba(146, 64, 14, 0.15)';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 20, 0, Math.PI * 2);
            ctx.fill();
        }

        function createConfetti(color) {
            for (let i = 0; i < 120; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 12 + 4;
                const colors = [color, '#fbbf24', '#ffffff', '#f59e0b'];
                particles.push(new Particle(
                    CANVAS_WIDTH / 2,
                    CANVAS_HEIGHT / 2,
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed - 8,
                    colors[Math.floor(Math.random() * colors.length)],
                    60 + Math.random() * 30,
                    2 + Math.random() * 3
                ));
            }
        }

        function updateLobby() {
            const slotsContainer = document.getElementById('playerSlots');
            slotsContainer.innerHTML = '';

            const availableControls = [
                { keys: { up: 'w', down: 's', left: 'a', right: 'd', dash: 'q', brake: 'e' }, name: 'Keyboard 1 (WASD)' },
                { keys: { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', dash: '.', brake: '/' }, name: 'Keyboard 2 (Arrows)' }
            ];

            const gamepads = navigator.getGamepads();
            for (let i = 0; i < gamepads.length; i++) {
                if (gamepads[i]) {
                    availableControls.push({ gamepadIndex: i, name: `Gamepad ${i + 1}` });
                }
            }

            for (let i = 0; i < 4; i++) {
                const slot = document.createElement('div');
                slot.className = 'playerSlot';

                if (i < availableControls.length) {
                    slot.className += ' ready';
                    slot.style.background = PLAYER_COLORS[i].main + '44';
                    slot.style.borderColor = PLAYER_COLORS[i].main;
                    slot.textContent = `Player ${i + 1} - ${availableControls[i].name} - READY`;
                } else {
                    slot.className += ' waiting';
                    slot.textContent = `Player ${i + 1} - Waiting...`;
                }

                slotsContainer.appendChild(slot);
            }

            if (availableControls.length >= 2) {
                document.getElementById('startButton').style.display = 'block';
            } else {
                document.getElementById('startButton').style.display = 'none';
            }

            return availableControls;
        }

        function startGame() {
            const availableControls = updateLobby();

            if (availableControls.length < 2) {
                return;
            }

            players = [];
            for (let i = 0; i < Math.min(availableControls.length, 4); i++) {
                players.push(new Player(i, PLAYER_COLORS[i], availableControls[i]));
            }

            document.getElementById('lobbyScreen').style.display = 'none';
            gameState = 'playing';
            currentRound = 1;
            arenaRadius = ARENA_RADIUS;
            targetArenaRadius = ARENA_RADIUS;
            updateScoreBoard();
            updateRoundInfo();
            showRoundTransition('ROUND 1');
        }

        function showRoundTransition(text) {
            roundTransitionTimer = 90;
            roundTransitionText = text;
        }

        function updateScoreBoard() {
            const scoreboard = document.getElementById('scoreBoard');
            scoreboard.innerHTML = '';

            const maxScore = Math.max(...players.map(p => p.score));

            players.forEach((player, i) => {
                const scoreDiv = document.createElement('div');
                scoreDiv.className = 'playerScore';
                if (player.score > 0 && player.score === maxScore) {
                    scoreDiv.className += ' leading';
                }
                scoreDiv.style.background = player.color.main + '88';
                scoreDiv.textContent = `P${i + 1}: ${player.score}`;
                scoreboard.appendChild(scoreDiv);
            });
        }

        function updateRoundInfo() {
            document.getElementById('roundInfo').textContent = `Round ${currentRound}/${MAX_ROUNDS}`;
        }

        function checkRoundEnd() {
            const alivePlayers = players.filter(p => p.alive);

            if (alivePlayers.length <= 1) {
                if (alivePlayers.length === 1) {
                    alivePlayers[0].score++;
                    createConfetti(alivePlayers[0].color.main);
                }

                updateScoreBoard();

                setTimeout(() => {
                    if (currentRound >= MAX_ROUNDS) {
                        endGame();
                    } else {
                        nextRound();
                    }
                }, 2000);

                gameState = 'roundOver';
            }
        }

        function nextRound() {
            currentRound++;
            targetArenaRadius = Math.max(ARENA_RADIUS - (currentRound - 1) * 25, 180);
            players.forEach(p => p.reset());
            updateRoundInfo();
            showRoundTransition(`ROUND ${currentRound}`);
            gameState = 'playing';
        }

        function endGame() {
            gameState = 'gameOver';

            let maxScore = 0;
            let winner = null;
            players.forEach((p, i) => {
                if (p.score > maxScore) {
                    maxScore = p.score;
                    winner = { player: p, index: i };
                }
            });

            // Save best score
            const bestScore = parseInt(safeGetItem('sumoBumpersHighScore', '0'));
            if (maxScore > bestScore) {
                safeSetItem('sumoBumpersHighScore', maxScore.toString());
            }

            const winnerScreen = document.getElementById('winnerScreen');
            const winnerText = document.getElementById('winnerText');
            winnerText.textContent = `Player ${winner.index + 1} Wins!`;
            winnerText.style.color = winner.player.color.main;
            winnerText.style.textShadow = `0 0 30px ${winner.player.color.glow}`;

            const statsDiv = document.getElementById('winnerStats');
            let statsHtml = '';
            players.forEach((p, i) => {
                statsHtml += `<span style="color:${p.color.main}">P${i + 1}: ${p.score} wins</span>  `;
            });
            statsDiv.innerHTML = statsHtml;

            winnerScreen.style.display = 'flex';
            createConfetti(winner.player.color.main);
        }

        function update() {
            if (gameState !== 'playing') return;

            // Smooth arena shrink
            if (arenaRadius !== targetArenaRadius) {
                arenaRadius += (targetArenaRadius - arenaRadius) * 0.02;
                if (Math.abs(arenaRadius - targetArenaRadius) < 0.5) {
                    arenaRadius = targetArenaRadius;
                }
            }

            players.forEach(p => p.update());
            checkCollisions();

            particles = particles.filter(p => {
                p.update();
                return p.life > 0;
            });

            updateScreenShake();

            if (roundTransitionTimer > 0) {
                roundTransitionTimer--;
            }

            checkRoundEnd();
        }

        function draw() {
            ctx.save();
            ctx.translate(screenShake.x, screenShake.y);

            ctx.clearRect(-10, -10, CANVAS_WIDTH + 20, CANVAS_HEIGHT + 20);
            drawArena();
            particles.forEach(p => p.draw());
            players.forEach(p => p.draw());

            // Round transition text
            if (roundTransitionTimer > 0) {
                const alpha = roundTransitionTimer > 60 ? 1 : roundTransitionTimer / 60;
                const scale = roundTransitionTimer > 70 ? 1 + (roundTransitionTimer - 70) * 0.05 : 1;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.font = `bold ${48 * scale}px Arial Black`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#fbbf24';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 10;
                ctx.fillText(roundTransitionText, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);
                ctx.shadowBlur = 0;
                ctx.restore();
            }

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function init() {
            eventManager.add(window, 'keydown', handleKeyDown);
            eventManager.add(window, 'keyup', handleKeyUp);
            eventManager.add(window, 'gamepadconnected', handleGamepadConnected);
            eventManager.add(window, 'gamepaddisconnected', handleGamepadDisconnected);
            eventManager.add(document.getElementById('startButton'), 'click', startGame);

            updateLobby();

            setInterval(() => {
                if (gameState === 'lobby') {
                    updateLobby();
                }
            }, 1000);

            gameLoop();
        }

        init();
    </script>
</body>
</html>

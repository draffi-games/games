<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penalty Shootout</title>
    <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTYiIGhlaWdodD0iMTYiIHZpZXdCb3g9IjAgMCAxNiAxNiIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPGNpcmNsZSBjeD0iOCIgY3k9IjgiIHI9IjciIGZpbGw9IndoaXRlIiBzdHJva2U9ImJsYWNrIiBzdHJva2Utd2lkdGg9IjEiLz4KPHBhdGggZD0iTSA4IDEgQSA3IDcgMCAwIDEgOCAxNSIgc3Ryb2tlPSJibGFjayIgZmlsbD0ibm9uZSIgc3Ryb2tlLXdpZHRoPSIxIi8+CjxwYXRoIGQ9Ik0gMSA4IEwgMTUgOCIgc3Ryb2tlPSJibGFjayIgc3Ryb2tlLXdpZHRoPSIxIi8+Cjwvc3ZnPgo=">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0e1a;
            --bg-field: #1a4d2e;
            --neon-green: #00ff41;
            --neon-blue: #00d4ff;
            --neon-yellow: #ffed4e;
            --neon-red: #ff073a;
            --white: #ffffff;
            --shadow-green: 0 0 20px var(--neon-green);
            --shadow-blue: 0 0 20px var(--neon-blue);
            --shadow-yellow: 0 0 20px var(--neon-yellow);
        }

        body {
            font-family: 'Courier New', monospace;
            background: var(--bg-dark);
            color: var(--white);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(90deg, #001f3f, #003d5c);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 2px 10px rgba(0, 212, 255, 0.3);
        }

        .title {
            font-size: 20px;
            color: var(--neon-blue);
            text-shadow: var(--shadow-blue);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats {
            display: flex;
            gap: 25px;
            font-size: 14px;
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .stat-label {
            color: #666;
            font-size: 10px;
            letter-spacing: 1px;
        }

        .stat-value {
            color: var(--neon-green);
            font-weight: bold;
            font-size: 18px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .stat-value.bump {
            transform: scale(1.5);
        }

        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 15px;
        }

        canvas {
            border: 2px solid rgba(0, 212, 255, 0.4);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
            cursor: crosshair;
            max-width: 100%;
            max-height: calc(100vh - 180px);
        }

        .power-container {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 12px 30px;
            border-radius: 10px;
            border: 2px solid var(--neon-yellow);
            box-shadow: var(--shadow-yellow);
            display: none;
        }

        .power-container.active {
            display: block;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(10px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .power-label {
            text-align: center;
            color: var(--neon-yellow);
            font-size: 11px;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .power-bar {
            width: 280px;
            height: 16px;
            background: #1a1a1a;
            border: 2px solid var(--neon-yellow);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .power-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-green), var(--neon-yellow), var(--neon-red));
            transition: width 0.05s linear;
        }

        /* Sweet spot indicator */
        .power-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 65%;
            width: 20%;
            height: 100%;
            border-left: 2px solid rgba(0, 255, 65, 0.5);
            border-right: 2px solid rgba(0, 255, 65, 0.5);
            background: rgba(0, 255, 65, 0.1);
        }

        .instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.92);
            padding: 30px 40px;
            border-radius: 15px;
            border: 3px solid var(--neon-green);
            box-shadow: var(--shadow-green);
            text-align: center;
            max-width: 500px;
            z-index: 100;
        }

        .instructions.hidden {
            display: none;
        }

        .instructions h2 {
            color: var(--neon-green);
            margin-bottom: 20px;
            font-size: 26px;
            text-shadow: var(--shadow-green);
        }

        .instructions p {
            margin: 8px 0;
            line-height: 1.6;
            font-size: 13px;
            color: #ccc;
        }

        .difficulty-buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            justify-content: center;
        }

        .btn {
            padding: 12px 25px;
            font-size: 15px;
            font-family: 'Courier New', monospace;
            border: 2px solid;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .btn-easy {
            background: rgba(0, 255, 65, 0.15);
            border-color: var(--neon-green);
            color: var(--neon-green);
        }
        .btn-easy:hover {
            background: rgba(0, 255, 65, 0.35);
            box-shadow: var(--shadow-green);
            transform: translateY(-2px);
        }

        .btn-medium {
            background: rgba(255, 237, 78, 0.15);
            border-color: var(--neon-yellow);
            color: var(--neon-yellow);
        }
        .btn-medium:hover {
            background: rgba(255, 237, 78, 0.35);
            box-shadow: var(--shadow-yellow);
            transform: translateY(-2px);
        }

        .btn-hard {
            background: rgba(255, 7, 58, 0.15);
            border-color: var(--neon-red);
            color: var(--neon-red);
        }
        .btn-hard:hover {
            background: rgba(255, 7, 58, 0.35);
            box-shadow: 0 0 20px var(--neon-red);
            transform: translateY(-2px);
        }

        .back-btn {
            position: absolute;
            top: 12px;
            right: 15px;
            padding: 6px 14px;
            background: rgba(0, 212, 255, 0.15);
            border: 1px solid rgba(0, 212, 255, 0.4);
            color: var(--neon-blue);
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            transition: all 0.3s;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(0, 212, 255, 0.3);
            box-shadow: var(--shadow-blue);
        }

        .message {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            font-weight: bold;
            padding: 15px 35px;
            border-radius: 10px;
            opacity: 0;
            pointer-events: none;
            z-index: 50;
        }

        .message.show {
            opacity: 1;
            animation: msgPop 0.3s ease-out;
        }

        @keyframes msgPop {
            0% { transform: translateX(-50%) scale(0.5); opacity: 0; }
            50% { transform: translateX(-50%) scale(1.1); }
            100% { transform: translateX(-50%) scale(1); opacity: 1; }
        }

        .message.goal {
            color: var(--neon-green);
            text-shadow: var(--shadow-green);
            background: rgba(0, 255, 65, 0.1);
            border: 2px solid var(--neon-green);
        }

        .message.miss {
            color: var(--neon-red);
            text-shadow: 0 0 20px var(--neon-red);
            background: rgba(255, 7, 58, 0.1);
            border: 2px solid var(--neon-red);
        }

        .message.save {
            color: var(--neon-yellow);
            text-shadow: var(--shadow-yellow);
            background: rgba(255, 237, 78, 0.1);
            border: 2px solid var(--neon-yellow);
        }

        .message.crossbar {
            color: #ff8c00;
            text-shadow: 0 0 20px #ff8c00;
            background: rgba(255, 140, 0, 0.1);
            border: 2px solid #ff8c00;
        }

        .round-info {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.4);
            font-size: 12px;
            letter-spacing: 2px;
        }

        @media (max-width: 768px) {
            .header { padding: 8px 12px; }
            .title { font-size: 16px; }
            .stats { gap: 12px; }
            .stat-label { font-size: 9px; }
            .stat-value { font-size: 14px; }
            .power-bar { width: 200px; }
            .instructions { padding: 20px; max-width: 90%; }
            .instructions p { font-size: 12px; }
            .difficulty-buttons { flex-direction: column; gap: 8px; }
            .btn { padding: 10px 20px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">PENALTY SHOOTOUT</div>
        <div class="stats">
            <div class="stat">
                <div class="stat-label">SCORE</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">STREAK</div>
                <div class="stat-value" id="streak">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">HIGH SCORE</div>
                <div class="stat-value" id="highscore">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">ACCURACY</div>
                <div class="stat-value" id="accuracy">0%</div>
            </div>
        </div>
    </div>

    <div class="game-container">
        <a href="../index.html" class="back-btn">← GRID OS</a>

        <canvas id="gameCanvas"></canvas>

        <div class="power-container" id="powerContainer">
            <div class="power-label">SHOT POWER</div>
            <div class="power-bar">
                <div class="power-fill" id="powerFill"></div>
            </div>
        </div>

        <div class="round-info" id="roundInfo"></div>
        <div class="message" id="message"></div>
    </div>

    <div class="instructions" id="instructions">
        <h2>HOW TO PLAY</h2>
        <p>1. Click on the goal to aim your shot</p>
        <p>2. Click again to set the power (green zone = sweet spot)</p>
        <p>3. Beat the goalkeeper and score!</p>
        <p>4. Build streaks for bonus points</p>
        <p style="margin-top: 15px; color: var(--neon-yellow);">Choose your difficulty:</p>
        <div class="difficulty-buttons">
            <button class="btn btn-easy" id="btnEasy">EASY</button>
            <button class="btn btn-medium" id="btnMedium">MEDIUM</button>
            <button class="btn btn-hard" id="btnHard">HARD</button>
        </div>
    </div>

    <script>
        // === DEBUG MODE ===
        const DEBUG = false;
        if (!DEBUG) {
            const noop = () => {};
            console.log = noop;
            console.warn = noop;
            console.info = noop;
        }

        // === SAFE LOCALSTORAGE ===
        function safeGetItem(key, defaultValue = null) {
            try {
                const item = localStorage.getItem(key);
                return item !== null ? item : defaultValue;
            } catch (error) {
                console.error('LocalStorage not available:', error);
                return defaultValue;
            }
        }
        function safeSetItem(key, value) {
            try { localStorage.setItem(key, value); return true; }
            catch (error) { console.error('LocalStorage not available:', error); return false; }
        }

        // === EVENT MANAGER ===
        class EventManager {
            constructor() { this.listeners = []; }
            add(element, event, handler, options) {
                element.addEventListener(event, handler, options);
                this.listeners.push({ element, event, handler, options });
            }
            removeAll() {
                this.listeners.forEach(({ element, event, handler, options }) => {
                    element.removeEventListener(event, handler, options);
                });
                this.listeners = [];
            }
        }
        const eventManager = new EventManager();

        // === SAFE CANVAS ===
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas ? canvas.getContext('2d') : null;
        if (!canvas || !ctx) {
            alert('Your browser does not support Canvas.');
        }

        canvas.width = 900;
        canvas.height = 700;

        // === SCREEN SHAKE ===
        let screenShake = { x: 0, y: 0, intensity: 0 };
        function addScreenShake(intensity) {
            screenShake.intensity = Math.max(screenShake.intensity, intensity);
        }
        function updateScreenShake() {
            if (screenShake.intensity > 0) {
                screenShake.x = (Math.random() - 0.5) * screenShake.intensity * 2;
                screenShake.y = (Math.random() - 0.5) * screenShake.intensity * 2;
                screenShake.intensity *= 0.82;
                if (screenShake.intensity < 0.5) {
                    screenShake.intensity = 0;
                    screenShake.x = 0;
                    screenShake.y = 0;
                }
            }
        }

        // === SOUND SYNTHESIS ===
        let audioContext;
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {}

        function playSound(type, param) {
            if (!audioContext) return;
            try {
                if (audioContext.state === 'suspended') audioContext.resume();
                const now = audioContext.currentTime;

                if (type === 'kick') {
                    // Kick sound with thump
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(200 + param * 100, now);
                    osc.frequency.exponentialRampToValueAtTime(60, now + 0.15);
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);

                    // Impact noise
                    const buf = audioContext.createBuffer(1, audioContext.sampleRate * 0.04, audioContext.sampleRate);
                    const d = buf.getChannelData(0);
                    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
                    const ns = audioContext.createBufferSource();
                    ns.buffer = buf;
                    const ng = audioContext.createGain();
                    ng.gain.setValueAtTime(0.08, now);
                    ng.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                    ns.connect(ng);
                    ng.connect(audioContext.destination);
                    ns.start(now);
                    ns.stop(now + 0.04);
                } else if (type === 'net') {
                    // Net swish
                    const buf = audioContext.createBuffer(1, audioContext.sampleRate * 0.2, audioContext.sampleRate);
                    const d = buf.getChannelData(0);
                    for (let i = 0; i < d.length; i++) {
                        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2) * 0.3;
                    }
                    const ns = audioContext.createBufferSource();
                    ns.buffer = buf;
                    const filter = audioContext.createBiquadFilter();
                    filter.type = 'highpass';
                    filter.frequency.value = 2000;
                    const gain = audioContext.createGain();
                    gain.gain.setValueAtTime(0.06, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    ns.connect(filter);
                    filter.connect(gain);
                    gain.connect(audioContext.destination);
                    ns.start(now);
                    ns.stop(now + 0.2);
                } else if (type === 'save') {
                    // Save thud
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.1);
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    gain.gain.setValueAtTime(0.06, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'crossbar') {
                    // Metallic ping
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1200, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.5);
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                    // Harmonic
                    const osc2 = audioContext.createOscillator();
                    const g2 = audioContext.createGain();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(2400, now);
                    osc2.connect(g2);
                    g2.connect(audioContext.destination);
                    g2.gain.setValueAtTime(0.04, now);
                    g2.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc2.start(now);
                    osc2.stop(now + 0.3);
                } else if (type === 'crowd') {
                    // Crowd roar
                    const duration = param || 0.8;
                    const buf = audioContext.createBuffer(1, audioContext.sampleRate * duration, audioContext.sampleRate);
                    const d = buf.getChannelData(0);
                    for (let i = 0; i < d.length; i++) {
                        const env = Math.sin(Math.PI * i / d.length);
                        d[i] = (Math.random() * 2 - 1) * env * 0.4;
                    }
                    const ns = audioContext.createBufferSource();
                    ns.buffer = buf;
                    const filter = audioContext.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.value = 600;
                    filter.Q.value = 0.4;
                    const gain = audioContext.createGain();
                    gain.gain.setValueAtTime(0.07, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                    ns.connect(filter);
                    filter.connect(gain);
                    gain.connect(audioContext.destination);
                    ns.start(now);
                    ns.stop(now + duration);
                } else if (type === 'whistle') {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(900, now);
                    osc.frequency.setValueAtTime(1100, now + 0.1);
                    osc.frequency.setValueAtTime(900, now + 0.2);
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'goalCheer') {
                    // Rising tone celebration
                    for (let i = 0; i < 3; i++) {
                        const osc = audioContext.createOscillator();
                        const g = audioContext.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(400 + i * 200, now + i * 0.1);
                        osc.connect(g);
                        g.connect(audioContext.destination);
                        g.gain.setValueAtTime(0.06, now + i * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.25);
                        osc.start(now + i * 0.1);
                        osc.stop(now + i * 0.1 + 0.25);
                    }
                } else if (type === 'miss') {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.3);
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    gain.gain.setValueAtTime(0.04, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'aim') {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    gain.gain.setValueAtTime(0.04, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                }
            } catch (e) {}
        }

        // === TWEEN HELPERS ===
        function easeOutElastic(t) {
            const c4 = (2 * Math.PI) / 3;
            return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
        }

        let gameState = {
            difficulty: 'medium',
            score: 0,
            streak: 0,
            bestStreak: 0,
            highscore: parseInt(safeGetItem('penaltyHighscore', '0')),
            totalShots: 0,
            goals: 0,
            phase: 'aiming',
            targetX: null,
            targetY: null,
            power: 0,
            powerDirection: 1,
            ball: null,
            goalkeeper: null,
            particles: [],
            crowd: [],
            crowdCheer: 0,
            shotChecked: false,
            aimIndicator: null,
            running: false,
            netRipples: [],
            grassParticles: [],
            confetti: [],
            spotlightAngle: 0,
            messageAnim: { scale: 0, targetScale: 0 }
        };

        const difficulties = {
            easy: { speed: 0.12, reactionTime: 0.55, prediction: 0.25, coverage: 0.55 },
            medium: { speed: 0.22, reactionTime: 0.3, prediction: 0.55, coverage: 0.7 },
            hard: { speed: 0.35, reactionTime: 0.12, prediction: 0.85, coverage: 0.9 }
        };

        function bumpStat(id) {
            const el = document.getElementById(id);
            el.classList.remove('bump');
            void el.offsetWidth;
            el.classList.add('bump');
            setTimeout(() => el.classList.remove('bump'), 300);
        }

        function startGame(difficulty) {
            gameState.difficulty = difficulty;
            gameState.running = true;
            document.getElementById('instructions').classList.add('hidden');
            initCrowd();
            updateStats();
            resetShot();
            gameLoop();
        }

        function initCrowd() {
            gameState.crowd = [];
            for (let i = 0; i < 150; i++) {
                gameState.crowd.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * 180 + 20,
                    size: Math.random() * 3 + 2,
                    color: ['#ff6b6b', '#4dabf7', '#ffd43b', '#69db7c', '#cc5de8', '#ff922b'][Math.floor(Math.random() * 6)],
                    phase: Math.random() * Math.PI * 2,
                    speed: 0.03 + Math.random() * 0.02,
                    armPhase: Math.random() * Math.PI * 2
                });
            }
        }

        function resetShot() {
            gameState.phase = 'aiming';
            gameState.targetX = null;
            gameState.targetY = null;
            gameState.power = 0;
            gameState.powerDirection = 1;
            gameState.shotChecked = false;
            gameState.aimIndicator = null;
            gameState.netRipples = [];
            gameState.confetti = [];
            gameState.ball = {
                x: canvas.width / 2,
                y: canvas.height - 120,
                vx: 0, vy: 0,
                z: 0, vz: 0,
                radius: 18,
                rotation: 0,
                spin: 0
            };
            gameState.goalkeeper = {
                x: canvas.width / 2,
                y: 280,
                targetX: canvas.width / 2,
                diving: false,
                diveDirection: 0,
                diveProgress: 0,
                width: 100,
                height: 140,
                armAngle: 0,
                idleSway: 0
            };
            document.getElementById('powerContainer').classList.remove('active');
            updateRoundInfo();
        }

        function updateRoundInfo() {
            const info = document.getElementById('roundInfo');
            info.textContent = `SHOT ${gameState.totalShots + 1} | ${gameState.difficulty.toUpperCase()} MODE`;
        }

        // Canvas click handler (also handles touch)
        function handleCanvasInput(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const x = (clientX - rect.left) * (canvas.width / rect.width);
            const y = (clientY - rect.top) * (canvas.height / rect.height);

            if (gameState.phase === 'aiming') {
                if (y < 400 && x > 180 && x < 720) {
                    gameState.targetX = x;
                    gameState.targetY = y;
                    gameState.phase = 'power';
                    document.getElementById('powerContainer').classList.add('active');
                    playSound('aim');
                }
            } else if (gameState.phase === 'power') {
                shootBall();
            }
        }

        // Track mouse for aim indicator
        eventManager.add(canvas, 'mousemove', (e) => {
            if (gameState.phase !== 'aiming') return;
            const rect = canvas.getBoundingClientRect();
            gameState.aimIndicator = {
                x: (e.clientX - rect.left) * (canvas.width / rect.width),
                y: (e.clientY - rect.top) * (canvas.height / rect.height)
            };
        });

        eventManager.add(canvas, 'click', (e) => {
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
            handleCanvasInput(e.clientX, e.clientY);
        });

        // Touch support
        eventManager.add(canvas, 'touchstart', (e) => {
            e.preventDefault();
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
            const touch = e.touches[0];
            handleCanvasInput(touch.clientX, touch.clientY);
        }, { passive: false });

        // Difficulty buttons
        eventManager.add(document.getElementById('btnEasy'), 'click', () => startGame('easy'));
        eventManager.add(document.getElementById('btnMedium'), 'click', () => startGame('medium'));
        eventManager.add(document.getElementById('btnHard'), 'click', () => startGame('hard'));

        function updatePowerBar() {
            if (gameState.phase === 'power') {
                gameState.power += 0.025 * gameState.powerDirection;
                if (gameState.power >= 1 || gameState.power <= 0) {
                    gameState.powerDirection *= -1;
                }
                document.getElementById('powerFill').style.width = (gameState.power * 100) + '%';
            }
        }

        function shootBall() {
            gameState.phase = 'shooting';
            document.getElementById('powerContainer').classList.remove('active');
            gameState.totalShots++;

            const dx = gameState.targetX - gameState.ball.x;
            const dy = gameState.targetY - gameState.ball.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            // Sweet spot: power between 0.65-0.85 gives better accuracy
            const inSweetSpot = gameState.power >= 0.65 && gameState.power <= 0.85;
            const accuracyBonus = inSweetSpot ? 0 : (Math.random() - 0.5) * 40;

            const speed = 12 + gameState.power * 18;
            gameState.ball.vx = (dx / distance) * speed + accuracyBonus * 0.3;
            gameState.ball.vy = (dy / distance) * speed;
            gameState.ball.vz = 12 + gameState.power * 8;
            gameState.ball.spin = (Math.random() - 0.5) * 0.4;

            // Grass particles on kick
            for (let i = 0; i < 20; i++) {
                const angle = Math.random() * Math.PI - Math.PI;
                const spd = Math.random() * 4 + 1;
                gameState.grassParticles.push({
                    x: gameState.ball.x + (Math.random() - 0.5) * 20,
                    y: gameState.ball.y + 10,
                    vx: Math.cos(angle) * spd,
                    vy: Math.sin(angle) * spd - 2,
                    size: Math.random() * 3 + 1,
                    color: Math.random() > 0.5 ? '#2d7a3e' : '#3da550',
                    life: 1
                });
            }

            // AI goalkeeper
            const difficulty = difficulties[gameState.difficulty];
            setTimeout(() => {
                const gk = gameState.goalkeeper;
                const predictionAccuracy = difficulty.prediction;

                const predictedX = gameState.targetX * predictionAccuracy +
                                 (canvas.width / 2) * (1 - predictionAccuracy);

                const randomness = (Math.random() - 0.5) * 100 * (1 - difficulty.coverage);
                gk.targetX = Math.max(220, Math.min(680, predictedX + randomness));

                gk.diving = true;
                gk.diveDirection = gk.targetX > gk.x ? 1 : -1;

            }, difficulty.reactionTime * 1000);

            playSound('kick', gameState.power);
            playSound('whistle');
            addScreenShake(3);
        }

        function update() {
            updatePowerBar();
            updateScreenShake();
            gameState.spotlightAngle += 0.02;

            if (gameState.phase === 'shooting') {
                // Update ball
                gameState.ball.x += gameState.ball.vx;
                gameState.ball.y += gameState.ball.vy;
                gameState.ball.z += gameState.ball.vz;
                gameState.ball.vz -= 0.6;
                gameState.ball.rotation += gameState.ball.spin || 0.2;

                // Trail particles
                if (gameState.ball.z > 0 && Math.random() > 0.3) {
                    gameState.particles.push({
                        x: gameState.ball.x + (Math.random() - 0.5) * 5,
                        y: gameState.ball.y - gameState.ball.z + (Math.random() - 0.5) * 5,
                        vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5,
                        color: 'rgba(255,255,255,0.5)',
                        life: 0.6,
                        size: 2 + Math.random() * 2
                    });
                }

                // Update goalkeeper
                const gk = gameState.goalkeeper;
                const gkDiff = gk.targetX - gk.x;
                const moveSpeed = difficulties[gameState.difficulty].speed;
                gk.x += gkDiff * moveSpeed;

                if (gk.diving && gk.diveProgress < 1) {
                    gk.diveProgress += 0.05;
                    gk.armAngle = gk.diveDirection * Math.sin(gk.diveProgress * Math.PI) * Math.PI / 2;
                }

                // Check goal
                if (!gameState.shotChecked && gameState.ball.y <= 300 && gameState.ball.z > 0) {
                    gameState.shotChecked = true;
                    checkGoal();
                }

                // Ball went out
                if ((gameState.ball.y < -50 || gameState.ball.x < -50 ||
                     gameState.ball.x > canvas.width + 50 || gameState.ball.z < -20) &&
                     gameState.shotChecked) {
                    setTimeout(resetShot, 1500);
                }
            } else {
                // Idle goalkeeper sway
                if (gameState.goalkeeper) {
                    gameState.goalkeeper.idleSway = Math.sin(Date.now() * 0.002) * 5;
                }
            }

            // Update crowd
            gameState.crowdCheer = Math.max(0, gameState.crowdCheer - 0.012);
            gameState.crowd.forEach(person => {
                person.phase += person.speed + gameState.crowdCheer * 0.15;
                person.armPhase += person.speed * 1.5;
            });

            // Update particles
            gameState.particles = gameState.particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.15;
                p.life -= 0.015;
                return p.life > 0;
            });

            // Update grass particles
            gameState.grassParticles = gameState.grassParticles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1;
                p.vx *= 0.98;
                p.life -= 0.02;
                return p.life > 0;
            });

            // Update net ripples
            gameState.netRipples = gameState.netRipples.filter(r => {
                r.radius += 2;
                r.life -= 0.025;
                return r.life > 0;
            });

            // Update confetti
            gameState.confetti = gameState.confetti.filter(c => {
                c.x += c.vx;
                c.y += c.vy;
                c.vy += 0.08;
                c.vx *= 0.99;
                c.rotation += c.rotSpeed;
                c.life -= 0.008;
                return c.life > 0;
            });
        }

        function checkGoal() {
            const ball = gameState.ball;
            const gk = gameState.goalkeeper;

            const inGoalX = ball.x > 220 && ball.x < 680;
            const inGoalY = ball.y > 80 && ball.y < 400;

            // Check crossbar hit (near top of goal)
            const nearCrossbar = ball.y > 70 && ball.y < 100 && inGoalX;
            const nearPost = (Math.abs(ball.x - 220) < 20 || Math.abs(ball.x - 680) < 20) && inGoalY;

            if (nearCrossbar || nearPost) {
                showMessage('CROSSBAR!', 'crossbar');
                gameState.streak = 0;
                playSound('crossbar');
                addScreenShake(12);
                updateStats();
                gameState.crowdCheer = 0.7;

                // Crossbar sparks
                createParticles(ball.x, ball.y, '#ff8c00', 25);
                createParticles(ball.x, ball.y, '#ffffff', 10);

                // Bounce ball away
                ball.vy = Math.abs(ball.vy) * 0.5;
                ball.vz = 8;
                return;
            }

            if (!inGoalX || !inGoalY) {
                showMessage('WIDE!', 'miss');
                gameState.streak = 0;
                playSound('miss');
                updateStats();
                return;
            }

            // Goalkeeper collision
            const gkReach = gk.diving ? gk.width * 1.8 : gk.width;
            const gkHeight = gk.diving ? gk.height * 0.6 : gk.height;
            const gkLeft = gk.x - gkReach / 2;
            const gkRight = gk.x + gkReach / 2;
            const gkTop = gk.y - gkHeight / 2;
            const gkBottom = gk.y + gkHeight / 2;

            const ballHitsGK = ball.x > gkLeft && ball.x < gkRight &&
                             ball.y > gkTop && ball.y < gkBottom;

            if (ballHitsGK) {
                showMessage('SAVED!', 'save');
                gameState.streak = 0;
                playSound('save');
                addScreenShake(5);
                updateStats();
                gameState.crowdCheer = 0.5;

                // Save particles
                createParticles(ball.x, ball.y, '#ffed4e', 20);
            } else {
                // GOAL!
                gameState.goals++;
                gameState.streak++;
                if (gameState.streak > gameState.bestStreak) {
                    gameState.bestStreak = gameState.streak;
                }
                const streakMultiplier = Math.min(gameState.streak, 5);
                const points = 10 + (streakMultiplier - 1) * 5;
                gameState.score += points;

                if (gameState.score > gameState.highscore) {
                    gameState.highscore = gameState.score;
                    safeSetItem('penaltyHighscore', gameState.highscore.toString());
                }

                showMessage(`GOAL! +${points}`, 'goal');

                // Net ripple effect
                for (let i = 0; i < 5; i++) {
                    gameState.netRipples.push({
                        x: ball.x,
                        y: ball.y,
                        radius: 5 + i * 3,
                        life: 1 - i * 0.1
                    });
                }

                // Goal particles
                createParticles(ball.x, ball.y, '#00ff41', 35);
                createParticles(ball.x, ball.y, '#ffd43b', 25);

                // Confetti on goal
                for (let i = 0; i < 60; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 6 + 2;
                    gameState.confetti.push({
                        x: ball.x,
                        y: ball.y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - 4,
                        color: ['#00ff41', '#ffd43b', '#ff073a', '#00d4ff', '#ffffff'][Math.floor(Math.random() * 5)],
                        life: 1,
                        size: Math.random() * 4 + 2,
                        rotation: Math.random() * Math.PI * 2,
                        rotSpeed: (Math.random() - 0.5) * 0.2
                    });
                }

                playSound('goalCheer');
                playSound('net');
                playSound('crowd', 1.2);
                addScreenShake(7);
                updateStats();
                gameState.crowdCheer = 1.0;
                bumpStat('score');
                bumpStat('streak');
            }
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message show ${type}`;
            setTimeout(() => {
                msg.classList.remove('show');
            }, 2000);
        }

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                gameState.particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 3,
                    color: color,
                    life: 1,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function updateStats() {
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('streak').textContent = gameState.streak;
            document.getElementById('highscore').textContent = gameState.highscore;
            const accuracy = gameState.totalShots > 0
                ? Math.round((gameState.goals / gameState.totalShots) * 100)
                : 0;
            document.getElementById('accuracy').textContent = accuracy + '%';
        }

        function draw() {
            ctx.save();
            ctx.translate(screenShake.x, screenShake.y);

            // Sky gradient
            const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGradient.addColorStop(0, '#0a1628');
            skyGradient.addColorStop(0.3, '#1a2a4a');
            skyGradient.addColorStop(1, '#0a0e1a');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawCrowd();
            drawField();
            drawGoal();

            // Draw net ripple effects
            gameState.netRipples.forEach(r => {
                ctx.globalAlpha = r.life * 0.3;
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                ctx.stroke();
            });
            ctx.globalAlpha = 1;

            drawGoalkeeper();

            // Spotlight on shooter during aiming
            if (gameState.phase === 'aiming' && gameState.ball) {
                const spotGrad = ctx.createRadialGradient(
                    gameState.ball.x, gameState.ball.y - 20, 10,
                    gameState.ball.x, gameState.ball.y - 20, 120
                );
                spotGrad.addColorStop(0, 'rgba(255, 255, 200, 0.08)');
                spotGrad.addColorStop(1, 'rgba(255, 255, 200, 0)');
                ctx.fillStyle = spotGrad;
                ctx.beginPath();
                ctx.arc(gameState.ball.x, gameState.ball.y - 20, 120, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw aim indicator
            if (gameState.phase === 'aiming' && gameState.aimIndicator) {
                const ai = gameState.aimIndicator;
                if (ai.y < 400 && ai.x > 180 && ai.x < 720) {
                    ctx.strokeStyle = 'rgba(0, 255, 65, 0.4)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.moveTo(gameState.ball.x, gameState.ball.y);
                    ctx.lineTo(ai.x, ai.y);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // Aim circle with glow
                    ctx.shadowColor = 'rgba(0, 255, 65, 0.4)';
                    ctx.shadowBlur = 10;
                    ctx.strokeStyle = 'rgba(0, 255, 65, 0.5)';
                    ctx.beginPath();
                    ctx.arc(ai.x, ai.y, 20, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            }

            // Draw target
            if (gameState.phase !== 'aiming' && gameState.targetX) {
                drawTarget(gameState.targetX, gameState.targetY);
            }

            // Draw grass particles
            gameState.grassParticles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size * 2);
            });
            ctx.globalAlpha = 1;

            drawBall();
            drawParticles();
            drawConfetti();

            // Instruction text
            if (gameState.phase === 'aiming') {
                ctx.fillStyle = 'rgba(0, 212, 255, 0.7)';
                ctx.font = 'bold 16px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('Click on the goal to aim your shot!', canvas.width / 2, canvas.height - 40);
            }

            ctx.restore();
        }

        function drawCrowd() {
            // Stadium stands with gradient
            const standGrad = ctx.createLinearGradient(0, 0, 0, 200);
            standGrad.addColorStop(0, '#1a1a2a');
            standGrad.addColorStop(1, '#2a2a3a');
            ctx.fillStyle = standGrad;
            ctx.fillRect(0, 0, canvas.width, 200);

            // Side stands (darker)
            ctx.fillStyle = '#141420';
            ctx.fillRect(0, 0, 180, 200);
            ctx.fillRect(canvas.width - 180, 0, 180, 200);

            // Stadium lights with animated glow
            for (let i = 0; i < 4; i++) {
                const lx = 150 + i * 200;
                const flicker = 0.02 + Math.sin(Date.now() * 0.003 + i) * 0.01;
                ctx.fillStyle = `rgba(255, 255, 200, ${flicker})`;
                ctx.beginPath();
                ctx.arc(lx, 10, 120, 0, Math.PI * 2);
                ctx.fill();

                // Light beam
                ctx.fillStyle = `rgba(255, 255, 200, ${flicker * 0.3})`;
                ctx.beginPath();
                ctx.moveTo(lx - 5, 10);
                ctx.lineTo(lx - 60, 200);
                ctx.lineTo(lx + 60, 200);
                ctx.lineTo(lx + 5, 10);
                ctx.closePath();
                ctx.fill();
            }

            // Crowd with arm animation during cheers
            gameState.crowd.forEach(person => {
                const bounce = Math.sin(person.phase) * 3 * gameState.crowdCheer;
                const armUp = gameState.crowdCheer > 0.3 ? Math.abs(Math.sin(person.armPhase)) * 4 * gameState.crowdCheer : 0;

                ctx.fillStyle = person.color;
                ctx.globalAlpha = 0.7;
                // Head
                ctx.beginPath();
                ctx.arc(person.x, person.y + bounce, person.size, 0, Math.PI * 2);
                ctx.fill();
                // Arms (during cheer)
                if (armUp > 1) {
                    ctx.fillRect(person.x - 1, person.y + bounce - armUp - person.size, 2, armUp);
                }
            });
            ctx.globalAlpha = 1;
        }

        function drawField() {
            const fieldGradient = ctx.createLinearGradient(0, 200, 0, canvas.height);
            fieldGradient.addColorStop(0, '#2a5a3a');
            fieldGradient.addColorStop(0.5, '#1e5230');
            fieldGradient.addColorStop(1, '#1a4d2e');
            ctx.fillStyle = fieldGradient;
            ctx.fillRect(0, 200, canvas.width, canvas.height - 200);

            // Grass stripes with better visibility
            for (let i = 0; i < 8; i++) {
                if (i % 2 === 0) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.025)';
                    ctx.fillRect(0, 200 + i * 62, canvas.width, 62);
                }
            }

            // Grass texture
            ctx.fillStyle = 'rgba(0, 0, 0, 0.02)';
            for (let i = 0; i < 100; i++) {
                const gx = Math.random() * canvas.width;
                const gy = 200 + Math.random() * (canvas.height - 200);
                ctx.fillRect(gx, gy, 1, 3);
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.lineWidth = 2;

            // Penalty box
            ctx.beginPath();
            ctx.moveTo(250, 320);
            ctx.lineTo(250, canvas.height);
            ctx.moveTo(650, 320);
            ctx.lineTo(650, canvas.height);
            ctx.moveTo(250, 320);
            ctx.lineTo(650, 320);
            ctx.stroke();

            // Goal box
            ctx.strokeRect(320, 240, 260, 80);

            // Penalty spot with glow
            ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
            ctx.shadowBlur = 8;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height - 120, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Center arc
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.beginPath();
            ctx.ellipse(canvas.width / 2, canvas.height + 50, 100, 30, 0, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawGoal() {
            // Back net with slight animation
            const netSway = Math.sin(Date.now() * 0.002) * 0.5;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 12; i++) {
                const sway = netSway * (i / 12);
                ctx.beginPath();
                ctx.moveTo(220 + i * 38 + sway, 80);
                ctx.lineTo(220 + i * 38 + sway, 400);
                ctx.stroke();
            }
            for (let i = 0; i < 9; i++) {
                ctx.beginPath();
                ctx.moveTo(220, 80 + i * 40);
                ctx.lineTo(680, 80 + i * 40);
                ctx.stroke();
            }

            // Main frame with glow
            ctx.shadowColor = 'rgba(255, 255, 255, 0.4)';
            ctx.shadowBlur = 12;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 6;
            ctx.strokeRect(220, 80, 460, 320);
            ctx.shadowBlur = 0;

            // 3D side posts
            ctx.strokeStyle = '#cccccc';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(220, 80); ctx.lineTo(185, 115);
            ctx.moveTo(680, 80); ctx.lineTo(715, 115);
            ctx.moveTo(220, 400); ctx.lineTo(185, 415);
            ctx.moveTo(680, 400); ctx.lineTo(715, 415);
            ctx.stroke();

            // Post glow effect
            ctx.shadowColor = 'rgba(255, 255, 255, 0.2)';
            ctx.shadowBlur = 8;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.lineWidth = 10;
            ctx.strokeRect(218, 78, 464, 324);
            ctx.shadowBlur = 0;
        }

        function drawGoalkeeper() {
            const gk = gameState.goalkeeper;
            const swayX = gk.diving ? 0 : (gk.idleSway || 0);

            // Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.beginPath();
            ctx.ellipse(gk.x + swayX, gk.y + 80, 45, 15, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.save();
            ctx.translate(gk.x + swayX, gk.y);

            if (gk.diving) {
                ctx.rotate(gk.diveDirection * gk.diveProgress * 0.3);
            }

            // Legs
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(-14, 30, 10, 45);
            ctx.fillRect(4, 30, 10, 45);

            // Body (jersey)
            const jerseyGrad = ctx.createLinearGradient(-28, -20, 28, 30);
            jerseyGrad.addColorStop(0, '#c0392b');
            jerseyGrad.addColorStop(1, '#a93226');
            ctx.fillStyle = jerseyGrad;
            ctx.fillRect(-28, -20, 56, 50);

            // Jersey number
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.font = 'bold 18px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText('1', 0, 10);

            // Arms
            ctx.strokeStyle = '#c0392b';
            ctx.lineWidth = 14;
            ctx.lineCap = 'round';

            const leftArmAngle = gk.armAngle - Math.PI / 6;
            const rightArmAngle = -gk.armAngle + Math.PI / 6;

            ctx.beginPath();
            ctx.moveTo(-22, -8);
            ctx.lineTo(-22 + Math.cos(leftArmAngle) * 40, -8 + Math.sin(leftArmAngle) * 40);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(22, -8);
            ctx.lineTo(22 + Math.cos(rightArmAngle) * 40, -8 + Math.sin(rightArmAngle) * 40);
            ctx.stroke();

            // Gloves with enhanced glow
            ctx.fillStyle = '#00d4ff';
            ctx.shadowColor = '#00d4ff';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(-22 + Math.cos(leftArmAngle) * 40, -8 + Math.sin(leftArmAngle) * 40, 12, 0, Math.PI * 2);
            ctx.arc(22 + Math.cos(rightArmAngle) * 40, -8 + Math.sin(rightArmAngle) * 40, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Head
            ctx.fillStyle = '#d4a574';
            ctx.beginPath();
            ctx.arc(0, -38, 18, 0, Math.PI * 2);
            ctx.fill();

            // Hair
            ctx.fillStyle = '#2c1810';
            ctx.beginPath();
            ctx.arc(0, -42, 16, Math.PI, 0);
            ctx.fill();

            // Eyes
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(-6, -40, 2.5, 0, Math.PI * 2);
            ctx.arc(6, -40, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawBall() {
            const ball = gameState.ball;
            if (!ball) return;
            const scale = Math.max(0.1, 1 + ball.z * 0.008);
            const radius = Math.max(5, ball.radius * scale);

            // Shadow on ground
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.beginPath();
            ctx.ellipse(ball.x, canvas.height - 120, Math.abs(radius * 1.1), Math.abs(radius * 0.35), 0, 0, Math.PI * 2);
            ctx.fill();

            const ballY = ball.y - ball.z;

            // Ball glow when moving
            if (gameState.phase === 'shooting' && ball.z > 0) {
                ctx.shadowColor = 'rgba(255, 255, 255, 0.3)';
                ctx.shadowBlur = 15;
            }

            // Ball gradient
            const gradient = ctx.createRadialGradient(
                ball.x - radius * 0.3, ballY - radius * 0.3, 1,
                ball.x, ballY, Math.max(2, radius)
            );
            gradient.addColorStop(0, '#ffffff');
            gradient.addColorStop(0.6, '#f0f0f0');
            gradient.addColorStop(1, '#bbb');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(ball.x, ballY, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Ball pattern (spin effect)
            ctx.save();
            ctx.translate(ball.x, ballY);
            ctx.rotate(ball.rotation || 0);
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.lineWidth = 1.5;

            // Pentagon pattern for soccer ball look
            for (let i = 0; i < 5; i++) {
                const angle = (i * Math.PI * 2) / 5;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(angle) * radius * 0.55, Math.sin(angle) * radius * 0.55);
                ctx.stroke();
            }

            // Small pentagons
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            for (let i = 0; i < 5; i++) {
                const angle = (i * Math.PI * 2) / 5 + Math.PI / 5;
                const cx = Math.cos(angle) * radius * 0.4;
                const cy = Math.sin(angle) * radius * 0.4;
                ctx.beginPath();
                for (let j = 0; j < 5; j++) {
                    const a = (j * Math.PI * 2) / 5 + angle;
                    const px = cx + Math.cos(a) * radius * 0.15;
                    const py = cy + Math.sin(a) * radius * 0.15;
                    if (j === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
            }

            ctx.restore();

            // Ball outline
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(ball.x, ballY, radius, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawTarget(x, y) {
            const pulse = Math.sin(Date.now() * 0.008) * 5 + 30;

            ctx.strokeStyle = 'rgba(0, 255, 65, 0.5)';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);

            ctx.beginPath();
            ctx.arc(x, y, pulse, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(x - 40, y);
            ctx.lineTo(x + 40, y);
            ctx.moveTo(x, y - 40);
            ctx.lineTo(x, y + 40);
            ctx.stroke();

            ctx.setLineDash([]);

            // Inner dot with glow
            ctx.shadowColor = 'rgba(0, 255, 65, 0.6)';
            ctx.shadowBlur = 8;
            ctx.fillStyle = 'rgba(0, 255, 65, 0.6)';
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function drawParticles() {
            gameState.particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        function drawConfetti() {
            gameState.confetti.forEach(c => {
                ctx.save();
                ctx.globalAlpha = c.life;
                ctx.translate(c.x, c.y);
                ctx.rotate(c.rotation);
                ctx.fillStyle = c.color;
                ctx.fillRect(-c.size / 2, -c.size / 4, c.size, c.size / 2);
                ctx.restore();
            });
            ctx.globalAlpha = 1;
        }

        function gameLoop() {
            if (!gameState.running) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Initial display
        document.getElementById('highscore').textContent = gameState.highscore;
    </script>
</body>
</html>

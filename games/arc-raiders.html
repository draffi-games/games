            ctx.fillText('Accuracy: ' + acc + '%', cx, y);
            y += lineH;

            // Favourite weapon
            ctx.fillStyle = '#888';
            ctx.font = '12px monospace';
            const fav = Object.entries(p.weaponKills).sort((a,b) => b[1]-a[1])[0];
            ctx.fillText('Fav: ' + (fav ? fav[0] : 'N/A'), cx, y);
        }

        drawPlayerStats(p1, w/2 - 150, P1_COLOR, 'PLAYER 1');
        drawPlayerStats(p2, w/2 + 150, P2_COLOR, 'PLAYER 2');

        // VS divider
        ctx.fillStyle = '#555';
        ctx.font = 'bold 20px monospace';
        ctx.fillText('VS', w/2, statsY + lineH * 3 + 4);
    }

    const t = Date.now() / 1000;
    if (Math.floor(t * 2) % 2 === 0) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px monospace';
        ctx.fillText('PRESS ENTER FOR REMATCH', w/2, h * 0.88);
    }
    ctx.fillStyle = '#888';
    ctx.font = '12px monospace';
    ctx.fillText('ESC for menu', w/2, h * 0.93);
}

// Camera
const cameras = [{x: 0, y: 0}, {x: 0, y: 0}];

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'MENU') {
        drawMenu(ctx);
        return;
    }

    const vpW = Math.floor(canvas.width / 2);
    const vpH = canvas.height;

    // Update cameras (frame-rate independent smoothing)
    const camSmooth = 1 - Math.pow(0.0001, lastDt);
    players.forEach((p, i) => {
        const targetX = p.dead ? cameras[i].x : p.x;
        const targetY = p.dead ? cameras[i].y : p.y;
        cameras[i].x = lerp(cameras[i].x, targetX, camSmooth);
        cameras[i].y = lerp(cameras[i].y, targetY, camSmooth);
    });

    // Draw each viewport
    for (let i = 0; i < 2; i++) {
        const vpX = i * vpW;
        const shakeX = players[i].screenShake > 0 ? (Math.random() - 0.5) * 8 : 0;
        const shakeY = players[i].screenShake > 0 ? (Math.random() - 0.5) * 8 : 0;
        drawWorld(ctx, cameras[i].x + shakeX, cameras[i].y + shakeY, vpX, 0, vpW, vpH);
        drawHUD(ctx, players[i], vpX, 0, vpW, vpH);
    }

    // Vignette overlay per viewport
    for (let i = 0; i < 2; i++) {
        const vx = i * vpW;
        const vigGrad = ctx.createRadialGradient(vx + vpW/2, vpH/2, vpW * 0.35, vx + vpW/2, vpH/2, vpW * 0.75);
        vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
        vigGrad.addColorStop(1, 'rgba(0,0,0,0.35)');
        ctx.fillStyle = vigGrad;
        ctx.fillRect(vx, 0, vpW, vpH);
    }

    // Divider line with glow
    ctx.shadowColor = '#00ccff';
    ctx.shadowBlur = 12;
    ctx.strokeStyle = '#00ccff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(vpW, 0);
    ctx.lineTo(vpW, canvas.height);
    ctx.stroke();
    ctx.shadowBlur = 0;
    // Inner bright line
    ctx.strokeStyle = 'rgba(150,230,255,0.6)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(vpW, 0);
    ctx.lineTo(vpW, canvas.height);
    ctx.stroke();

    // Subtle scanline overlay (pre-rendered pattern)
    if (!render._scanPattern || render._scanH !== canvas.height) {
        const scanCvs = document.createElement('canvas');
        scanCvs.width = 1; scanCvs.height = 6;
        const sctx = scanCvs.getContext('2d');
        sctx.fillStyle = 'rgba(0,0,0,0.04)';
        sctx.fillRect(0, 0, 1, 1);
        render._scanPattern = ctx.createPattern(scanCvs, 'repeat');
        render._scanH = canvas.height;
    }
    ctx.fillStyle = render._scanPattern;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Kill feed (shared)
    drawKillFeed(ctx);

    // Game timer (top center, between viewports)
    if (gameState !== 'MENU') {
        const mins = Math.floor(matchTime / 60);
        const secs = Math.floor(matchTime % 60);
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(vpW - 30, 5, 60, 20);
        ctx.fillStyle = '#aaa';
        ctx.font = '12px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(mins + ':' + (secs < 10 ? '0' : '') + secs, vpW, 19);
    }

    // Falling ash (screen-space atmosphere)
    if (gameState !== 'MENU') {
        ashParticles.forEach(a => {
            a.y += a.speed * lastDt * 10;
            a.x += a.drift * lastDt * 10;
            if (a.y > 1) { a.y = 0; a.x = Math.random(); }
            if (a.x < 0 || a.x > 1) a.x = Math.random();
            ctx.fillStyle = `rgba(200,190,170,${a.alpha})`;
            ctx.beginPath();
            ctx.arc(a.x * canvas.width, a.y * canvas.height, a.size, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    if (gameState === 'GAME_OVER' && slowMoTimer <= 0) {
        drawGameOver(ctx);
    }

    // Fade-in overlay
    if (fadeAlpha > 0) {
        ctx.fillStyle = `rgba(0,0,0,${fadeAlpha})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
}

// ============================================================
// GAME LOOP
// ============================================================
function startGame() {
    gameState = 'PLAYING';
    gameTime = 0;
    winner = null;
    projectiles = [];
    particles = [];
    killFeed = [];
    // Reset v2.0 systems
    matchTime = 0;
    lights = [];
    scorchMarks = [];
    announcements = [];
    slowMoTimer = 0;
    fadeAlpha = 1; // Start with fade-in
    // Clear all key states to prevent involuntary shots from menu keys
    Object.keys(keys).forEach(k => keys[k] = false);

    players = [
        createPlayer(0, P1_COLOR, P1_COLOR_LIGHT, {
            up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD',
            shoot: 'Space', switchWeapon: 'KeyR', dash: 'KeyE'
        }),
        createPlayer(1, P2_COLOR, P2_COLOR_LIGHT, {
            up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight',
            shoot: 'Enter', switchWeapon: 'KeyP', dash: 'KeyK'
        })
    ];

    cameras[0] = {x: players[0].x, y: players[0].y};
    cameras[1] = {x: players[1].x, y: players[1].y};

    initPickups();
}

function gameLoop(timestamp) {
    let dt = Math.min((timestamp - lastTime) / 1000, 0.05); // Cap at 50ms
    lastTime = timestamp;

    // Slow-mo for final kill
    if (slowMoTimer > 0) {
        slowMoTimer -= dt;
        dt *= 0.2; // 5x slower
    }

    lastDt = dt;

    update(dt);
    render();

    requestAnimationFrame(gameLoop);
}

// Start
lastTime = performance.now();
requestAnimationFrame(gameLoop);

</script>

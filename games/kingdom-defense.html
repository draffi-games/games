<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kingdom Defense - Tower Defense</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏰</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a472a 0%, #2d5016 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        .game-container {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            max-width: 1250px;
        }

        h1 {
            text-align: center;
            margin-bottom: 15px;
            font-size: 2.2em;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            color: #ffd700;
            letter-spacing: 2px;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            background: rgba(80, 40, 10, 0.4);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 14px;
            border-radius: 10px;
            border: 1px solid rgba(139, 69, 19, 0.5);
        }

        .info-item {
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
        }

        .info-label {
            display: block;
            font-size: 0.75em;
            color: rgba(255,255,255,0.5);
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .gold { color: #ffd700; }
        .lives { color: #ff4444; }
        .wave { color: #66ccff; }

        .game-area {
            display: flex;
            gap: 20px;
        }

        #gameCanvas {
            border: 3px solid #8B4513;
            border-radius: 8px;
            background: #2d5016;
            cursor: crosshair;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 300px;
            max-height: 650px;
            overflow-y: auto;
        }

        .tower-select {
            background: rgba(80, 40, 10, 0.35);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(139, 69, 19, 0.4);
        }

        .tower-select h3 {
            margin-bottom: 10px;
            color: #ffd700;
            text-align: center;
            font-size: 0.9em;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .tower-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .tower-btn {
            padding: 12px 8px;
            background: rgba(60, 30, 10, 0.5);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            color: #fff;
            font-size: 0.85em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .tower-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            background: rgba(80, 40, 10, 0.7);
            border-color: rgba(255, 215, 0, 0.6);
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2);
        }

        .tower-btn.selected {
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3), inset 0 0 15px rgba(255, 215, 0, 0.1);
            color: #ffd700;
        }

        .tower-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }

        .tower-icon {
            font-size: 1.8em;
            display: block;
            margin-bottom: 5px;
        }

        .tower-name {
            font-size: 0.9em;
            display: block;
            margin-bottom: 3px;
        }

        .tower-cost {
            color: #ffd700;
            font-size: 0.85em;
        }

        .controls {
            background: rgba(80, 40, 10, 0.35);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(139, 69, 19, 0.4);
        }

        .control-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            background: rgba(30, 100, 30, 0.5);
            border: 1px solid rgba(50, 205, 50, 0.3);
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .control-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            background: rgba(30, 120, 30, 0.7);
            box-shadow: 0 4px 15px rgba(50, 205, 50, 0.2);
        }

        .control-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }

        .upgrade-btn {
            background: rgba(40, 60, 150, 0.5);
            border-color: rgba(65, 105, 225, 0.3);
        }

        .upgrade-btn:hover:not(:disabled) {
            background: rgba(40, 60, 180, 0.7);
            box-shadow: 0 4px 15px rgba(65, 105, 225, 0.25);
        }

        .sell-btn {
            background: rgba(130, 20, 20, 0.5);
            border-color: rgba(220, 20, 60, 0.3);
        }

        .sell-btn:hover:not(:disabled) {
            background: rgba(150, 20, 20, 0.7);
            box-shadow: 0 4px 15px rgba(220, 20, 60, 0.25);
        }

        .selected-tower-info {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: rgba(20, 50, 30, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 45px 55px;
            border-radius: 16px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .modal h2 {
            font-size: 2.8em;
            margin-bottom: 15px;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            letter-spacing: 4px;
        }

        .modal p {
            font-size: 1.1em;
            margin-bottom: 15px;
            color: rgba(255,255,255,0.7);
        }

        .modal-stats {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin: 20px 0 30px 0;
        }

        .modal-stat {
            text-align: center;
            padding: 10px 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .modal-stat-label {
            font-size: 0.75em;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal-stat-value {
            font-size: 1.4em;
            font-weight: bold;
            color: #ffd700;
        }

        .modal-btn {
            padding: 14px 35px;
            margin: 0 8px;
            font-size: 1em;
            font-weight: bold;
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .restart-btn {
            background: rgba(30, 120, 30, 0.6);
            color: #fff;
        }

        .menu-btn {
            background: rgba(60, 30, 15, 0.6);
            color: rgba(255,255,255,0.8);
        }

        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.25);
            border-color: rgba(255, 215, 0, 0.5);
        }

        .back-link {
            display: inline-block;
            text-align: center;
            margin-top: 15px;
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s;
            letter-spacing: 1px;
            padding: 6px 14px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
        }

        .back-link:hover {
            color: #ffd700;
            border-color: rgba(255, 215, 0, 0.3);
        }

        .sidebar::-webkit-scrollbar {
            width: 8px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #8B4513;
            border-radius: 4px;
        }

        @media (max-width: 1024px) {
            .game-area {
                flex-direction: column;
                align-items: center;
            }

            .sidebar {
                width: 100%;
                max-width: 600px;
                max-height: none;
            }

            .tower-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🏰 Kingdom Defense 🏰</h1>

        <div class="game-info">
            <div class="info-item">
                <span class="info-label">Gold</span>
                <span class="gold">💰 <span id="goldDisplay">250</span></span>
            </div>
            <div class="info-item">
                <span class="info-label">Leben</span>
                <span class="lives">❤️ <span id="livesDisplay">20</span></span>
            </div>
            <div class="info-item">
                <span class="info-label">Welle</span>
                <span class="wave">🌊 <span id="waveDisplay">0</span>/15</span>
            </div>
        </div>

        <div class="game-area">
            <canvas id="gameCanvas" width="900" height="600"></canvas>

            <div class="sidebar">
                <div class="tower-select">
                    <h3>Türme Bauen</h3>
                    <div class="tower-grid">
                        <button class="tower-btn" id="archerBtn">
                            <span class="tower-icon">🏹</span>
                            <span class="tower-name">Bogenschütze</span>
                            <span class="tower-cost">💰 50</span>
                        </button>
                        <button class="tower-btn" id="cannonBtn">
                            <span class="tower-icon">💣</span>
                            <span class="tower-name">Kanone</span>
                            <span class="tower-cost">💰 100</span>
                        </button>
                        <button class="tower-btn" id="magicBtn">
                            <span class="tower-icon">🔮</span>
                            <span class="tower-name">Magier</span>
                            <span class="tower-cost">💰 150</span>
                        </button>
                        <button class="tower-btn" id="poisonBtn">
                            <span class="tower-icon">☠️</span>
                            <span class="tower-name">Gift</span>
                            <span class="tower-cost">💰 125</span>
                        </button>
                        <button class="tower-btn" id="frostBtn">
                            <span class="tower-icon">❄️</span>
                            <span class="tower-name">Frost</span>
                            <span class="tower-cost">💰 175</span>
                        </button>
                        <button class="tower-btn" id="lightningBtn">
                            <span class="tower-icon">⚡</span>
                            <span class="tower-name">Blitz</span>
                            <span class="tower-cost">💰 200</span>
                        </button>
                        <button class="tower-btn" id="ballistaBtn">
                            <span class="tower-icon">🎯</span>
                            <span class="tower-name">Ballista</span>
                            <span class="tower-cost">💰 250</span>
                        </button>
                    </div>
                </div>

                <div class="controls">
                    <div id="selectedTowerInfo" class="selected-tower-info" style="display: none;">
                        <strong>Turm ausgewählt</strong>
                        <div id="towerDetails"></div>
                    </div>
                    <button class="control-btn" id="startWaveBtn">▶️ Nächste Welle [Leertaste]</button>
                    <button class="control-btn upgrade-btn" id="upgradeBtn" style="display: none;">⬆️ Upgrade (💰 <span id="upgradeCost">0</span>)</button>
                    <button class="control-btn sell-btn" id="sellBtn" style="display: none;">💰 Verkaufen (💰 <span id="sellValue">0</span>)</button>
                </div>
            </div>
        </div>

        <a href="../index.html" class="back-link">← Zurück zur Galerie</a>
    </div>

    <div id="gameOverModal" class="modal">
        <div class="modal-content">
            <h2>Niederlage</h2>
            <p>Dein Königreich wurde überrannt!</p>
            <div class="modal-stats">
                <div class="modal-stat">
                    <div class="modal-stat-label">Wellen</div>
                    <div class="modal-stat-value"><span id="finalWave">0</span>/15</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-label">Türme</div>
                    <div class="modal-stat-value" id="finalTowers">0</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-label">Gold</div>
                    <div class="modal-stat-value" id="finalGold">0</div>
                </div>
            </div>
            <button class="modal-btn restart-btn" onclick="location.reload()">Nochmal spielen</button>
            <button class="modal-btn menu-btn" onclick="location.href='../index.html'">Zurück zur Galerie</button>
        </div>
    </div>

    <div id="victoryModal" class="modal">
        <div class="modal-content">
            <h2>Sieg!</h2>
            <p>Dein Königreich wurde erfolgreich verteidigt!</p>
            <div class="modal-stats">
                <div class="modal-stat">
                    <div class="modal-stat-label">Wellen</div>
                    <div class="modal-stat-value">15/15</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-label">Türme</div>
                    <div class="modal-stat-value" id="victoryTowers">0</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-label">Gold</div>
                    <div class="modal-stat-value" id="victoryGold">0</div>
                </div>
            </div>
            <button class="modal-btn restart-btn" onclick="location.reload()">Nochmal spielen</button>
            <button class="modal-btn menu-btn" onclick="location.href='../index.html'">Zurück zur Galerie</button>
        </div>
    </div>

    <script>
        const DEBUG = false;
        if (!DEBUG) {
            const noop = () => {};
            console.log = noop;
            console.warn = noop;
            console.info = noop;
        }

        class EventManager {
            constructor() { this.listeners = []; }
            add(element, event, handler, options) {
                element.addEventListener(event, handler, options);
                this.listeners.push({ element, event, handler, options });
            }
            removeAll() {
                this.listeners.forEach(({ element, event, handler, options }) => {
                    element.removeEventListener(event, handler, options);
                });
                this.listeners = [];
            }
        }

        function safeGetItem(key, defaultValue = null) {
            try {
                const item = localStorage.getItem(key);
                return item !== null ? item : defaultValue;
            } catch (error) {
                console.error('LocalStorage not available:', error);
                return defaultValue;
            }
        }

        function safeSetItem(key, value) {
            try {
                localStorage.setItem(key, value);
                return true;
            } catch (error) {
                console.error('LocalStorage not available:', error);
                return false;
            }
        }

        function initCanvas() {
            const canvas = document.getElementById('gameCanvas');
            if (!canvas) {
                console.error('Canvas element not found');
                return null;
            }
            const ctx = canvas.getContext('2d');
            if (!ctx) {
                console.error('Canvas 2D context not available');
                return null;
            }
            return { canvas, ctx };
        }

        const canvasSetup = initCanvas();
        if (!canvasSetup) {
            alert('Your browser does not support Canvas. Please use a modern browser.');
            throw new Error('Canvas not supported');
        }
        const { canvas, ctx } = canvasSetup;
        const eventManager = new EventManager();

        // ========== GAME JUICE ENGINE ==========
        // Screen Shake
        const shake = { x: 0, y: 0, intensity: 0, decay: 0.92 };
        function triggerShake(intensity) {
            shake.intensity = Math.max(shake.intensity, intensity);
        }
        function updateShake() {
            if (shake.intensity > 0.5) {
                shake.x = (Math.random() - 0.5) * shake.intensity;
                shake.y = (Math.random() - 0.5) * shake.intensity;
                shake.intensity *= shake.decay;
            } else {
                shake.x = shake.y = shake.intensity = 0;
            }
        }

        // Sound Synthesis
        let _audioCtx = null;
        function getAudioCtx() {
            try {
                if (!_audioCtx || _audioCtx.state === 'closed') _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (_audioCtx.state === 'suspended') _audioCtx.resume();
                return _audioCtx;
            } catch(e) { return null; }
        }
        function playSound(freq, dur, type='sine', vol=0.08) {
            const ac = getAudioCtx(); if (!ac) return;
            try {
                const o = ac.createOscillator(), g = ac.createGain();
                o.connect(g); g.connect(ac.destination);
                o.frequency.setValueAtTime(freq, ac.currentTime);
                o.type = type;
                g.gain.setValueAtTime(vol, ac.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
                o.start(ac.currentTime); o.stop(ac.currentTime + dur);
            } catch(e) {}
        }
        function sfxArrowFire() { playSound(800, 0.08, 'triangle', 0.06); }
        function sfxImpact() { playSound(120, 0.15, 'sawtooth', 0.1); }
        function sfxExplosion() {
            playSound(60, 0.3, 'sawtooth', 0.12);
            playSound(40, 0.4, 'square', 0.08);
        }
        function sfxGoldCollect() {
            playSound(1200, 0.06, 'sine', 0.05);
            setTimeout(() => playSound(1600, 0.06, 'sine', 0.04), 60);
        }
        function sfxWaveHorn() {
            const ac = getAudioCtx(); if (!ac) return;
            try {
                const o = ac.createOscillator(), g = ac.createGain();
                o.connect(g); g.connect(ac.destination);
                o.type = 'sawtooth';
                o.frequency.setValueAtTime(220, ac.currentTime);
                o.frequency.linearRampToValueAtTime(330, ac.currentTime + 0.3);
                g.gain.setValueAtTime(0.06, ac.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.8);
                o.start(ac.currentTime); o.stop(ac.currentTime + 0.8);
            } catch(e) {}
        }
        function sfxBuild() { playSound(400, 0.1, 'square', 0.06); playSound(600, 0.1, 'sine', 0.04); }
        function sfxBossAppear() {
            playSound(80, 0.5, 'sawtooth', 0.1);
            playSound(100, 0.6, 'square', 0.06);
            triggerShake(12);
        }

        // Tweened counters
        const tweenedValues = { gold: 250, lives: 20, wave: 0 };
        function updateTweenedValues() {
            tweenedValues.gold += (gold - tweenedValues.gold) * 0.15;
            tweenedValues.lives += (lives - tweenedValues.lives) * 0.2;
            tweenedValues.wave += (currentWave - tweenedValues.wave) * 0.1;
        }

        // Enhanced particles for gold sparkle
        function createGoldSparkle(x, y) {
            for (let i = 0; i < 6; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 3,
                    vy: (Math.random() - 0.5) * 3 - 2,
                    life: 20 + Math.random() * 15,
                    maxLife: 35,
                    color: `hsl(${45 + Math.random()*15}, 100%, ${60 + Math.random()*30}%)`,
                    size: 2 + Math.random() * 3,
                    isSparkle: true,
                    update() {
                        this.x += this.vx; this.y += this.vy;
                        this.vy += 0.1; this.life--;
                        return this.life <= 0;
                    },
                    draw() {
                        ctx.globalAlpha = this.life / this.maxLife;
                        ctx.fillStyle = this.color;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size * (this.life / this.maxLife), 0, Math.PI * 2);
                        ctx.fill();
                        ctx.globalAlpha = 1;
                    }
                });
            }
        }

        // Dust particles for building
        function createDustCloud(x, y) {
            for (let i = 0; i < 10; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 2;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1,
                    life: 20 + Math.random() * 15,
                    maxLife: 35,
                    color: `rgba(139,115,85,${0.5 + Math.random()*0.3})`,
                    size: 4 + Math.random() * 6,
                    update() {
                        this.x += this.vx; this.y += this.vy;
                        this.vx *= 0.95; this.vy *= 0.95;
                        this.life--;
                        return this.life <= 0;
                    },
                    draw() {
                        ctx.globalAlpha = (this.life / this.maxLife) * 0.6;
                        ctx.fillStyle = this.color;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size * (0.5 + 0.5 * this.life / this.maxLife), 0, Math.PI * 2);
                        ctx.fill();
                        ctx.globalAlpha = 1;
                    }
                });
            }
        }

        // Muzzle flash effect
        function createMuzzleFlash(x, y, color) {
            effects.push({
                x, y, life: 6, maxLife: 6, color,
                update() { this.life--; return this.life <= 0; },
                draw() {
                    const alpha = this.life / this.maxLife;
                    const r = 8 + (1 - alpha) * 12;
                    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
                    grad.addColorStop(0, `rgba(255,255,255,${alpha * 0.8})`);
                    grad.addColorStop(0.3, this.color.replace(')', `,${alpha * 0.6})`).replace('rgb', 'rgba'));
                    grad.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        // Enemy death burst
        function createDeathBurst(x, y, color) {
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2;
                const speed = 2 + Math.random() * 3;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 15 + Math.random() * 10,
                    maxLife: 25,
                    color: i % 3 === 0 ? '#fff' : color,

                    update() {
                        this.x += this.vx; this.y += this.vy;
                        this.vx *= 0.92; this.vy *= 0.92;
                        this.life--;
                        return this.life <= 0;
                    },
                    draw() {
                        ctx.globalAlpha = this.life / this.maxLife;
                        ctx.fillStyle = this.color;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size * (this.life / this.maxLife), 0, Math.PI * 2);
                        ctx.fill();
                        ctx.globalAlpha = 1;
                    }
                });
            }

        // Tower class
        class Tower {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.level = 1;
                this.lastShot = 0;
                this.target = null;
            }

            getStats() {
                const base = towerTypes[this.type];
                const multiplier = 1 + (this.level - 1) * 0.6;
                return {
                    damage: base.damage * multiplier,
                    range: base.range * (1 + (this.level - 1) * 0.25),
                    cooldown: base.cooldown / (1 + (this.level - 1) * 0.18),
                    ...base
                };
            }

            getUpgradeCost() {
                const base = towerTypes[this.type].upgradeCost;
                const multipliers = [1, 1.5, 2, 3, 4, 5.5, 7, 9, 12];
                return Math.round(base * multipliers[this.level - 1]);
            }

            getVisualSize() {
                if (this.level <= 3) return 20;
                if (this.level <= 6) return 25;
                return 30;
            }

            update(timestamp) {
                const stats = this.getStats();

                if (timestamp - this.lastShot < stats.cooldown) return;

                // Find target
                this.target = null;
                let closestDist = Infinity;

                for (let enemy of enemies) {
                    const dist = Math.hypot(enemy.x - this.x, enemy.y - this.y);
                    if (dist <= stats.range && dist < closestDist) {
                        this.target = enemy;
                        closestDist = dist;
                    }
                }

                // Shoot
                if (this.target) {
                    projectiles.push(new Projectile(this.x, this.y, this.target, this.type, stats.damage, this.level));
                    this.lastShot = timestamp;
                    sfxArrowFire();
                    triggerShake(2);
                    createMuzzleFlash(this.x, this.y, `rgb(${parseInt(stats.color.slice(1,3),16)},${parseInt(stats.color.slice(3,5),16)},${parseInt(stats.color.slice(5,7),16)})`);
                }
            }

            draw() {
                const stats = this.getStats();
                const size = this.getVisualSize();

                // Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.beginPath();
                ctx.ellipse(this.x + 3, this.y + 3, size + 2, size - 2, 0, 0, Math.PI * 2);
                ctx.fill();

                // Glow for high level towers
                if (this.level >= 5) {
                    const glowSize = size + 5 + Math.sin(Date.now() / 200) * 3;
                    const gradient = ctx.createRadialGradient(this.x, this.y, size, this.x, this.y, glowSize);
                    gradient.addColorStop(0, 'rgba(255, 215, 0, 0)');
                    gradient.addColorStop(1, 'rgba(255, 215, 0, 0.3)');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Base pedestal
                ctx.fillStyle = '#4a4a4a';
                ctx.beginPath();
                ctx.arc(this.x, this.y, size + 4, 0, Math.PI * 2);
                ctx.fill();

                // Tower body
                const gradient = ctx.createRadialGradient(this.x - 5, this.y - 5, 0, this.x, this.y, size);
                gradient.addColorStop(0, lightenColor(stats.color, 30));
                gradient.addColorStop(1, stats.color);
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = darkenColor(stats.color, 30);
                ctx.lineWidth = 2;

                    ctx.strokeStyle = '#000';

                    rangeGrad.addColorStop(0, `rgba(255, 255, 255, 0)`);

                    rangeGrad.addColorStop(1, `rgba(255, 215, 0, 0)`);
                    ctx.fillStyle = rangeGrad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, stats.range, 0, Math.PI * 2);

        // Enemy class
        class Enemy {
            constructor(type) {
                this.type = type;
                const stats = enemyTypes[type];
                const hpMultiplier = currentWave >= 10 ? 1 + (currentWave - 9) * 0.2 : 1;
                this.hp = stats.hp * hpMultiplier;
                this.maxHp = stats.hp * hpMultiplier;
                this.speed = stats.speed;
                this.baseSpeed = stats.speed;
                this.reward = stats.reward;
                this.pathIndex = 0;
                this.progress = 0;
                this.x = path[0].x;
                this.y = path[0].y;
                this.slowUntil = 0;
                this.poisonUntil = 0;
                this.poisonDamage = 0;
                this.lastPoisonTick = 0;
            }

            update() {
                // Poison damage
                if (this.poisonUntil > Date.now()) {
                    if (Date.now() - this.lastPoisonTick > 1000) {
                        this.damage(this.poisonDamage);
                        this.lastPoisonTick = Date.now();
                    }
                }

                // Update speed based on slow
                if (this.slowUntil > Date.now()) {
                    this.speed = this.baseSpeed * 0.5;
                } else {
                    this.speed = this.baseSpeed;
                }

                if (this.pathIndex >= path.length - 1) {
                    lives--;
                    triggerShake(10);
                    sfxExplosion();
                    updateDisplay();
                    if (lives <= 0) gameOver();
                    return true;
                }

                const start = path[this.pathIndex];
                const end = path[this.pathIndex + 1];

                const dx = end.x - start.x;
                const dy = end.y - start.y;
                const dist = Math.hypot(dx, dy);

                this.progress += this.speed / dist;

                if (this.progress >= 1) {
                    this.progress = 0;
                    this.pathIndex++;
                    if (this.pathIndex >= path.length - 1) {
                        lives--;
                        updateDisplay();
                        if (lives <= 0) gameOver();
                        return true;
                    }
                }

                this.x = start.x + dx * this.progress;
                this.y = start.y + dy * this.progress;

                return false;
            }

            damage(amount) {
                this.hp -= amount;
                if (this.hp <= 0) {
                    gold += this.reward;
                    updateDisplay();
                    createParticles(this.x, this.y, enemyTypes[this.type].color);
                    createDeathBurst(this.x, this.y, enemyTypes[this.type].color);
                    createGoldSparkle(this.x, this.y);
                    sfxGoldCollect();
                    sfxImpact();
                    triggerShake(3);
                    return true;
                }
                return false;
            }

            applySlow(duration) {
                this.slowUntil = Math.max(this.slowUntil, Date.now() + duration);
            }

            applyPoison(damage, duration) {
                this.poisonUntil = Math.max(this.poisonUntil, Date.now() + duration);
                this.poisonDamage = damage;
                this.lastPoisonTick = Date.now();
            }

            draw() {
                const stats = enemyTypes[this.type];
                const r = stats.size / 2;

                // Shadow

                ctx.beginPath();
                ctx.ellipse(this.x + 2, this.y + r + 2, r * 0.8, r * 0.3, 0, 0, Math.PI * 2);
                ctx.fill();

                // Status effect overlays
                if (this.slowUntil > Date.now()) {
                    ctx.fillStyle = 'rgba(135, 206, 235, 0.35)';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, r + 5, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (this.poisonUntil > Date.now()) {
                    ctx.fillStyle = 'rgba(0, 255, 0, 0.25)';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, r + 3, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Enemy body with gradient
                const bodyGrad = ctx.createRadialGradient(this.x - 2, this.y - 2, 0, this.x, this.y, r);
                bodyGrad.addColorStop(0, lightenColor(stats.color, 20));
                bodyGrad.addColorStop(1, darkenColor(stats.color, 20));
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = darkenColor(stats.color, 40);
                ctx.lineWidth = 2;
                ctx.stroke();

                // Type indicator
                if (this.type === 'dragon' || this.type === 'demon') {
                    ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
                    const glowSize = r + 5 + Math.sin(Date.now() / 200) * 3;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
                    ctx.fill();
                }

                // HP bar
                const barWidth = stats.size + 10;
                const barHeight = 4;
                const hpPercent = this.hp / this.maxHp;

                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(this.x - barWidth / 2 - 1, this.y - r - 11, barWidth + 2, barHeight + 2);

                const hpColor = hpPercent > 0.5 ? '#00FF00' : hpPercent > 0.25 ? '#FFFF00' : '#FF0000';
                ctx.fillStyle = hpColor;
                ctx.fillRect(this.x - barWidth / 2, this.y - r - 10, barWidth * hpPercent, barHeight);
            }
        }

        // Projectile class
        class Projectile {
            constructor(x, y, target, towerType, damage, level) {
                this.x = x;
                this.y = y;
                this.target = target;
                this.towerType = towerType;
                this.damage = damage;
                this.level = level;
                this.speed = 5;
                this.trail = [];
            }

            update() {
                if (!this.target || this.target.hp <= 0) return true;

                const dx = this.target.x - this.x;
                const dy = this.target.y - this.y;
                const dist = Math.hypot(dx, dy);

                // Add trail
                this.trail.push({ x: this.x, y: this.y, life: 10 });
                if (this.trail.length > 5) this.trail.shift();

                if (dist < this.speed) {
                    this.hit();
                    return true;
                }

                this.x += (dx / dist) * this.speed;
                this.y += (dy / dist) * this.speed;

                return false;
            }

            hit() {
                const stats = towerTypes[this.towerType];

                if (stats.aoe) {
                    // Area damage
                    for (let enemy of enemies) {
                        const dist = Math.hypot(enemy.x - this.target.x, enemy.y - this.target.y);
                        if (dist <= stats.aoe) {
                            enemy.damage(this.damage);
                        }
                    }
                    createParticles(this.target.x, this.target.y, '#FF8800', 15);
                    sfxExplosion();
                    triggerShake(6);
                } else if (stats.pierce) {
                    // Pierce damage
                    const angle = Math.atan2(this.target.y - this.y, this.target.x - this.x);
                    for (let enemy of enemies) {
                        const enemyAngle = Math.atan2(enemy.y - this.y, enemy.x - this.x);
                        const angleDiff = Math.abs(enemyAngle - angle);
                        const dist = Math.hypot(enemy.x - this.x, enemy.y - this.y);
                        if (angleDiff < 0.3 && dist < stats.range) {
                            enemy.damage(this.damage);
                        }
                    }
                } else if (stats.chain) {
                    // Chain lightning
                    let targets = [this.target];
                    this.target.damage(this.damage);

                    for (let i = 1; i < stats.chainTargets && targets.length > 0; i++) {
                        let lastTarget = targets[targets.length - 1];
                        let nextTarget = null;
                        let closestDist = Infinity;

                        for (let enemy of enemies) {
                            if (targets.includes(enemy)) continue;
                            const dist = Math.hypot(enemy.x - lastTarget.x, enemy.y - lastTarget.y);
                            if (dist < 150 && dist < closestDist) {
                                nextTarget = enemy;
                                closestDist = dist;
                            }
                        }

                        if (nextTarget) {
                            targets.push(nextTarget);
                            nextTarget.damage(this.damage * 0.7);
                            effects.push(new LightningEffect(lastTarget.x, lastTarget.y, nextTarget.x, nextTarget.y));
                        }
                    }
                } else if (stats.slow) {
                    // Frost slow
                    this.target.damage(this.damage);
                    this.target.applySlow(stats.slowDuration);
                    createParticles(this.target.x, this.target.y, '#87CEEB', 10);
                } else if (stats.poison) {
                    // Poison DoT
                    this.target.damage(this.damage);
                    this.target.applyPoison(stats.poisonDamage * (1 + (this.level - 1) * 0.5), stats.poisonDuration);
                    createParticles(this.target.x, this.target.y, '#00FF00', 10);
                } else {
                    // Single target
                    this.target.damage(this.damage);
                }
            }

            draw() {
                const stats = towerTypes[this.towerType];

                // Glow trail
                this.trail.forEach((point, index) => {
                    const t = index / this.trail.length;
                    ctx.globalAlpha = t * 0.4;
                    const glowR = 6 + t * 4;
                    const grad = ctx.createRadialGradient(point.x, point.y, 0, point.x, point.y, glowR);
                    grad.addColorStop(0, stats.projectileColor);
                    grad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(point.x, point.y, glowR, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1;

                // Main projectile with glow
                const size = stats.projectileSize || 5;
                const projGrad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, size + 4);
                projGrad.addColorStop(0, '#fff');
                projGrad.addColorStop(0.4, stats.projectileColor);
                projGrad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = projGrad;
                ctx.beginPath();
                ctx.arc(this.x, this.y, size + 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = stats.projectileColor;
                ctx.beginPath();
                ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
                ctx.fill();

                if (this.level >= 5) {
                    ctx.strokeStyle = '#FFD700';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }
        }

        // Lightning Effect
        class LightningEffect {
            constructor(x1, y1, x2, y2) {
                this.x1 = x1;
                this.y1 = y1;
                this.x2 = x2;
                this.y2 = y2;
                this.life = 10;
            }

            update() {
                this.life--;
                return this.life <= 0;
            }

            draw() {
                ctx.globalAlpha = this.life / 10;
                ctx.strokeStyle = '#FFFF00';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(this.x1, this.y1);

                // Jagged lightning
                const steps = 3;
                for (let i = 1; i <= steps; i++) {
                    const t = i / steps;
                    const x = this.x1 + (this.x2 - this.x1) * t + (Math.random() - 0.5) * 20;
                    const y = this.y1 + (this.y2 - this.y1) * t + (Math.random() - 0.5) * 20;
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(this.x2, this.y2);
                ctx.stroke();
                ctx.globalAlpha = 1;
            }
        }

        // Particle effect
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4;
                this.life = 30;
                this.color = color;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
                return this.life <= 0;
            }

            draw() {
                ctx.globalAlpha = this.life / 30;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, 4, 4);
                ctx.globalAlpha = 1;
            }
        }

        function createParticles(x, y, color, count = 8) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        // Color utilities
        function lightenColor(color, percent) {
            const num = parseInt(color.replace("#",""), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.min(255, (num >> 16) + amt);
            const G = Math.min(255, (num >> 8 & 0x00FF) + amt);
            const B = Math.min(255, (num & 0x0000FF) + amt);
            return "#" + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
        }

        function darkenColor(color, percent) {
            const num = parseInt(color.replace("#",""), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.max(0, (num >> 16) - amt);
            const G = Math.max(0, (num >> 8 & 0x00FF) - amt);
            const B = Math.max(0, (num & 0x0000FF) - amt);
            return "#" + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
        }

        // Generate static terrain elements once
        const terrainElements = [];
        function generateTerrain() {
            terrainElements.length = 0;
            // Trees and bushes
            for (let i = 0; i < 40; i++) {
                let x, y, valid = false;
                for (let attempt = 0; attempt < 20; attempt++) {
                    x = 30 + Math.random() * (canvas.width - 60);
                    y = 30 + Math.random() * (canvas.height - 60);
                    valid = true;
                    for (let j = 0; j < path.length - 1; j++) {
                        if (distanceToLineSegment(x, y, path[j].x, path[j].y, path[j+1].x, path[j+1].y) < 55) {
                            valid = false;
                            break;
                        }
                    }
                    if (valid) break;
                }
                if (valid) {
                    terrainElements.push({
                        x, y,
                        type: Math.random() > 0.6 ? 'tree' : 'bush',
                        size: 6 + Math.random() * 8,
                        shade: `hsl(${100 + Math.random() * 40}, ${40 + Math.random() * 20}%, ${20 + Math.random() * 15}%)`
                    });
                }
            }
            // Grass patches
            for (let i = 0; i < 80; i++) {
                terrainElements.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    type: 'grass',
                    size: 2 + Math.random() * 3,
                    shade: `hsl(${90 + Math.random() * 30}, ${30 + Math.random() * 20}%, ${25 + Math.random() * 10}%)`
                });
            }
        }
        generateTerrain();

        // Draw path
        function drawPath() {
            // Path shadow
            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            ctx.lineWidth = 46;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(path[0].x + 3, path[0].y + 3);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i].x + 3, path[i].y + 3);
            }
            ctx.stroke();

            // Path base
            ctx.strokeStyle = '#4a3420';
            ctx.lineWidth = 44;
            ctx.beginPath();
            ctx.moveTo(path[0].x, path[0].y);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i].x, path[i].y);
            }
            ctx.stroke();

            // Path surface
            ctx.strokeStyle = '#7a5c3e';
            ctx.lineWidth = 36;
            ctx.beginPath();
            ctx.moveTo(path[0].x, path[0].y);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i].x, path[i].y);
            }
            ctx.stroke();

            // Path highlight
            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 16;
            ctx.beginPath();
            ctx.moveTo(path[0].x, path[0].y - 3);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i].x, path[i].y - 3);
            }
            ctx.stroke();

            // Draw terrain
            terrainElements.forEach(t => {
                ctx.fillStyle = t.shade;
                if (t.type === 'tree') {
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, t.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(0,0,0,0.15)';
                    ctx.beginPath();
                    ctx.ellipse(t.x + 2, t.y + t.size + 2, t.size * 0.6, t.size * 0.2, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else if (t.type === 'bush') {
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, t.size * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillRect(t.x, t.y, t.size * 0.4, t.size);
                }
            });

            // Ambient path glow
            ctx.shadowColor = 'rgba(200, 150, 80, 0.3)';
            ctx.shadowBlur = 12;
            ctx.strokeStyle = 'rgba(200, 150, 80, 0.08)';
            ctx.lineWidth = 50;
            ctx.beginPath();
            ctx.moveTo(path[0].x, path[0].y);
            for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Spawn marker
            const start = path[0];
            ctx.fillStyle = 'rgba(255, 0, 0, 0.15)';
            ctx.beginPath();
            ctx.arc(start.x, start.y, 25 + Math.sin(Date.now() / 500) * 3, 0, Math.PI * 2);
            ctx.fill();

            // Castle at end
            const end = path[path.length - 1];
            ctx.font = '48px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🏰', end.x, end.y);
        }

        // Check if position is valid for tower
        function isValidTowerPosition(x, y) {
            // Check path proximity
            for (let i = 0; i < path.length - 1; i++) {
                const start = path[i];
                const end = path[i + 1];

                const dist = distanceToLineSegment(x, y, start.x, start.y, end.x, end.y);
                if (dist < 50) return false;
            }

            // Check existing towers
            for (let tower of towers) {
                const dist = Math.hypot(tower.x - x, tower.y - y);
                if (dist < 50) return false;
            }

            // Check bounds
            if (x < 40 || x > canvas.width - 40 || y < 40 || y > canvas.height - 40) {
                return false;
            }

            return true;
        }

        function distanceToLineSegment(px, py, x1, y1, x2, y2) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const lengthSquared = dx * dx + dy * dy;

            if (lengthSquared === 0) {
                return Math.hypot(px - x1, py - y1);
            }

            let t = ((px - x1) * dx + (py - y1) * dy) / lengthSquared;
            t = Math.max(0, Math.min(1, t));

            const projX = x1 + t * dx;
            const projY = y1 + t * dy;

            return Math.hypot(px - projX, py - projY);
        }

        // Start wave
        function startWave() {
            if (waveInProgress || currentWave >= waves.length) return;

            currentWave++;
            waveInProgress = true;
            updateDisplay();
            showWaveAnnouncement(`Welle ${currentWave}`);
            sfxWaveHorn();
            triggerShake(5);

            const waveConfig = waves[currentWave - 1];
            let enemyQueue = [];

            for (let type in waveConfig) {
                for (let i = 0; i < waveConfig[type]; i++) {
                    enemyQueue.push(type);
                }
            }

            // Shuffle
            enemyQueue.sort(() => Math.random() - 0.5);

            let spawnIndex = 0;
            const spawnInterval = setInterval(() => {
                if (spawnIndex >= enemyQueue.length) {
                    clearInterval(spawnInterval);
                    return;
                }

                enemies.push(new Enemy(enemyQueue[spawnIndex]));
                spawnIndex++;
            }, 600);
        }

        // Game loop
        function gameLoop(timestamp) {
            if (!gameRunning) return;

            // Update juice systems
            updateShake();
            updateTweenedValues();

            // Apply screen shake
            ctx.save();
            ctx.translate(shake.x, shake.y);

            // Clear canvas with gradient
            const bgGrad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            bgGrad.addColorStop(0, '#2d5016');
            bgGrad.addColorStop(0.5, '#3a6020');
            bgGrad.addColorStop(1, '#2d5016');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw path
            drawPath();

            // Update and draw enemies
            enemies = enemies.filter(enemy => {
                const remove = enemy.update();
                if (!remove) enemy.draw();
                return !remove;
            });

            // Update and draw towers
            for (let tower of towers) {
                tower.update(timestamp);
                tower.draw();
            }

            // Update and draw projectiles
            projectiles = projectiles.filter(proj => {
                const remove = proj.update();
                if (!remove) proj.draw();
                return !remove;
            });

            // Remove dead enemies (killed by projectiles)
            enemies = enemies.filter(enemy => enemy.hp > 0);

            // Update and draw effects
            effects = effects.filter(effect => {
                const remove = effect.update();
                if (!remove) effect.draw();
                return !remove;
            });

            // Update and draw particles
            particles = particles.filter(particle => {
                const remove = particle.update();
                if (!remove) particle.draw();
                return !remove;
            });

            // Check wave complete
            if (waveInProgress && enemies.length === 0) {
                waveInProgress = false;
                gold += 50 + (currentWave * 15);
                updateDisplay();

                if (currentWave >= waves.length) {
                    victory();
                }
            }

            // Wave announcement
            drawWaveAnnouncement();

            // Restore shake transform
            ctx.restore();

            // Draw tower preview
            if (selectedTowerType && !selectedTower) {
                const stats = towerTypes[selectedTowerType];
                const valid = isValidTowerPosition(mouseX, mouseY);

                ctx.globalAlpha = 0.5;
                ctx.fillStyle = valid ? stats.color : '#FF0000';
                ctx.beginPath();
                ctx.arc(mouseX, mouseY, 20, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = valid ? 'rgba(255, 255, 255, 0.5)' : 'rgba(255, 0, 0, 0.5)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(mouseX, mouseY, stats.range, 0, Math.PI * 2);
                ctx.stroke();
                ctx.globalAlpha = 1;
            }

            requestAnimationFrame(gameLoop);
        }

        // Update display
        function updateDisplay() {
            document.getElementById('goldDisplay').textContent = Math.round(tweenedValues.gold);
            document.getElementById('livesDisplay').textContent = Math.round(tweenedValues.lives);
            document.getElementById('waveDisplay').textContent = currentWave;

            document.getElementById('archerBtn').disabled = gold < 50;
            document.getElementById('cannonBtn').disabled = gold < 100;
            document.getElementById('magicBtn').disabled = gold < 150;
            document.getElementById('poisonBtn').disabled = gold < 125;
            document.getElementById('frostBtn').disabled = gold < 175;
            document.getElementById('lightningBtn').disabled = gold < 200;
            document.getElementById('ballistaBtn').disabled = gold < 250;

            document.getElementById('startWaveBtn').disabled = waveInProgress || currentWave >= waves.length;
        }

        // Wave announcement overlay
        let waveAnnouncement = { text: '', timer: 0 };

        function showWaveAnnouncement(text) {
            waveAnnouncement.text = text;
            waveAnnouncement.timer = 90;
        }

        function easeOutElastic(t) {
            if (t === 0 || t === 1) return t;
            return Math.pow(2, -10 * t) * Math.sin((t - 0.1) * 5 * Math.PI) + 1;
        }
        function drawWaveAnnouncement() {
            if (waveAnnouncement.timer <= 0) return;
            waveAnnouncement.timer--;
            const progress = 1 - waveAnnouncement.timer / 90;
            const alpha = waveAnnouncement.timer > 30 ? 1 : waveAnnouncement.timer / 30;
            const elasticT = Math.min(1, progress * 3);
            const scale = progress < 0.33 ? easeOutElastic(elasticT) : 1;
            const slideX = progress < 0.33 ? (1 - easeOutElastic(elasticT)) * -200 : 0;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(canvas.width / 2 + slideX, canvas.height / 2);
            ctx.scale(scale, scale);
            ctx.font = `bold 32px Segoe UI`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffd700';
            ctx.shadowColor = 'rgba(255,215,0,0.5)';
            ctx.shadowBlur = 15;
            ctx.fillText(waveAnnouncement.text, 0, 0);
            ctx.shadowBlur = 0;
            ctx.restore();
        }

        // Game over
        function gameOver() {
            gameRunning = false;
            const bestWave = parseInt(safeGetItem('kingdomDefenseBestWave', '0'));
            if (currentWave > bestWave) {
                safeSetItem('kingdomDefenseBestWave', currentWave.toString());
            }
            document.getElementById('finalWave').textContent = currentWave;
            document.getElementById('finalTowers').textContent = towers.length;
            document.getElementById('finalGold').textContent = gold;
            document.getElementById('gameOverModal').style.display = 'flex';
        }

        // Victory
        function victory() {
            gameRunning = false;
            safeSetItem('kingdomDefenseBestWave', '15');
            document.getElementById('victoryTowers').textContent = towers.length;
            document.getElementById('victoryGold').textContent = gold;
            document.getElementById('victoryModal').style.display = 'flex';
        }

        // Event listeners
        eventManager.add(canvas, 'mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
        });

        eventManager.add(canvas, 'click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);

            // Check if clicking existing tower
            selectedTower = null;
            for (let tower of towers) {
                const dist = Math.hypot(tower.x - x, tower.y - y);
                if (dist < 25) {
                    selectedTower = tower;
                    updateTowerInfo();
                    return;
                }
            }

            // Place new tower
            if (selectedTowerType) {
                const stats = towerTypes[selectedTowerType];
                if (gold >= stats.cost && isValidTowerPosition(x, y)) {
                    towers.push(new Tower(x, y, selectedTowerType));
                    gold -= stats.cost;
                    updateDisplay();
                    createParticles(x, y, '#ffd700', 12);
                    createDustCloud(x, y);
                    sfxBuild();
                    triggerShake(3);
                }
            }

            updateTowerInfo();
        });

        // Touch support for mobile
        eventManager.add(canvas, 'touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = (touch.clientX - rect.left) * (canvas.width / rect.width);
            const y = (touch.clientY - rect.top) * (canvas.height / rect.height);
            mouseX = x;
            mouseY = y;

            selectedTower = null;
            for (let tower of towers) {
                const dist = Math.hypot(tower.x - x, tower.y - y);
                if (dist < 30) {
                    selectedTower = tower;
                    updateTowerInfo();
                    return;
                }
            }

            if (selectedTowerType) {
                const stats = towerTypes[selectedTowerType];
                if (gold >= stats.cost && isValidTowerPosition(x, y)) {
                    towers.push(new Tower(x, y, selectedTowerType));
                    gold -= stats.cost;
                    updateDisplay();
                    createParticles(x, y, '#ffd700', 12);
                    createDustCloud(x, y);
                    sfxBuild();
                    triggerShake(3);
                }
            }
            updateTowerInfo();
        }, { passive: false });

        function updateTowerInfo() {
            const infoDiv = document.getElementById('selectedTowerInfo');
            const detailsDiv = document.getElementById('towerDetails');
            const upgradeBtn = document.getElementById('upgradeBtn');
            const sellBtn = document.getElementById('sellBtn');

            if (selectedTower) {
                const stats = selectedTower.getStats();
                detailsDiv.innerHTML = `
                    <div><strong>${stats.name}</strong> Level ${selectedTower.level}/10</div>
                    <div>Schaden: ${Math.round(stats.damage)}</div>
                    <div>Reichweite: ${Math.round(stats.range)}</div>
                    <div>Cooldown: ${Math.round(stats.cooldown)}ms</div>
                `;
                infoDiv.style.display = 'block';

                const upgradeCost = selectedTower.getUpgradeCost();
                document.getElementById('upgradeCost').textContent = upgradeCost;
                upgradeBtn.style.display = 'block';
                upgradeBtn.disabled = gold < upgradeCost || selectedTower.level >= 10;

                const totalCost = towerTypes[selectedTower.type].cost +
                    (selectedTower.level > 1 ? Array.from({length: selectedTower.level - 1}, (_, i) => {
                        const base = towerTypes[selectedTower.type].upgradeCost;
                        const multipliers = [1, 1.5, 2, 3, 4, 5.5, 7, 9, 12];
                        return Math.round(base * multipliers[i]);
                    }).reduce((a, b) => a + b, 0) : 0);
                const sellValue = Math.round(totalCost * 0.7);
                document.getElementById('sellValue').textContent = sellValue;
                sellBtn.style.display = 'block';
            } else {
                infoDiv.style.display = 'none';
                upgradeBtn.style.display = 'none';
                sellBtn.style.display = 'none';
            }
        }

        // Tower selection buttons
        const towerButtons = {
            archerBtn: 'archer',
            cannonBtn: 'cannon',
            magicBtn: 'magic',
            poisonBtn: 'poison',
            frostBtn: 'frost',
            lightningBtn: 'lightning',
            ballistaBtn: 'ballista'
        };

        for (let btnId in towerButtons) {
            eventManager.add(document.getElementById(btnId), 'click', () => {
                selectedTowerType = towerButtons[btnId];
                selectedTower = null;
                document.querySelectorAll('.tower-btn').forEach(btn => btn.classList.remove('selected'));
                document.getElementById(btnId).classList.add('selected');
                updateTowerInfo();
            });
        }

        // Keyboard shortcuts for tower selection
        eventManager.add(window, 'keydown', (e) => {
            const shortcuts = { '1': 'archerBtn', '2': 'cannonBtn', '3': 'magicBtn', '4': 'poisonBtn', '5': 'frostBtn', '6': 'lightningBtn', '7': 'ballistaBtn' };
            if (shortcuts[e.key]) {
                const btnId = shortcuts[e.key];
                selectedTowerType = towerButtons[btnId];
                selectedTower = null;
                document.querySelectorAll('.tower-btn').forEach(btn => btn.classList.remove('selected'));
                document.getElementById(btnId).classList.add('selected');
                updateTowerInfo();
            }
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                startWave();
            }
            if (e.key === 'Escape') {
                selectedTowerType = null;
                selectedTower = null;
                document.querySelectorAll('.tower-btn').forEach(btn => btn.classList.remove('selected'));
                updateTowerInfo();
            }
            if (e.key === 'u' || e.key === 'U') {
                if (selectedTower) document.getElementById('upgradeBtn').click();
            }
        });

        // Control buttons
        eventManager.add(document.getElementById('startWaveBtn'), 'click', startWave);

        eventManager.add(document.getElementById('upgradeBtn'), 'click', () => {
            if (selectedTower) {
                const upgradeCost = selectedTower.getUpgradeCost();
                if (gold >= upgradeCost && selectedTower.level < 10) {
                    gold -= upgradeCost;
                    selectedTower.level++;
                    createParticles(selectedTower.x, selectedTower.y, '#FFD700', 15);
                    updateDisplay();
                    updateTowerInfo();
                }
            }
        });

        eventManager.add(document.getElementById('sellBtn'), 'click', () => {
            if (selectedTower) {
                const totalCost = towerTypes[selectedTower.type].cost +
                    (selectedTower.level > 1 ? Array.from({length: selectedTower.level - 1}, (_, i) => {
                        const base = towerTypes[selectedTower.type].upgradeCost;
                        const multipliers = [1, 1.5, 2, 3, 4, 5.5, 7, 9, 12];
                        return Math.round(base * multipliers[i]);
                    }).reduce((a, b) => a + b, 0) : 0);
                const sellValue = Math.round(totalCost * 0.7);
                gold += sellValue;
                createParticles(selectedTower.x, selectedTower.y, '#ffd700', 10);
                towers = towers.filter(t => t !== selectedTower);
                selectedTower = null;
                updateDisplay();
                updateTowerInfo();
            }
        });

        // Initialize
        updateDisplay();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>

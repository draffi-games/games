<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a2e;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            border: 4px solid #5a3a1a;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0,0,0,0.35), inset 0 0 0 2px rgba(255,255,255,0.1);
        }

        canvas {
            display: block;
        }

        .ui {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .score {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%) scale(1);
            font-size: 52px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 0 0 20px rgba(255,215,0,0.3);
            pointer-events: none;
            transition: none;
        }

        .start-screen, .game-over-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            pointer-events: all;
            backdrop-filter: blur(4px);
        }

        .game-over-screen {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        }

        .game-over-screen.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .start-screen h1, .game-over-screen h1 {
            font-size: 44px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .start-screen p, .game-over-screen p {
            font-size: 18px;
            margin-bottom: 25px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            line-height: 1.6;
            max-width: 300px;
        }

        .btn {
            font-size: 22px;
            padding: 14px 36px;
            background: linear-gradient(145deg, #4CAF50, #388E3C);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-weight: bold;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: linear-gradient(145deg, #66BB6A, #43A047);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.35);
        }

        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .high-score {
            font-size: 16px;
            margin-top: 15px;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
        }

        .game-over-screen .score-display {
            font-size: 56px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(255,215,0,0.4);
        }

        .game-over-screen .new-record {
            color: #ff6b6b;
            font-size: 18px;
            margin-bottom: 15px;
            display: none;
            animation: celebratePulse 0.8s infinite;
        }

        .game-over-screen .new-record.visible { display: block; }

        @keyframes celebratePulse {
            0%,100% { opacity: 1; transform: scale(1); text-shadow: 0 0 10px rgba(255,107,107,0.5); }
            50% { opacity: 0.8; transform: scale(1.1); text-shadow: 0 0 25px rgba(255,107,107,0.8); }
        }

        .back-link {
            position: absolute;
            top: 15px; left: 15px;
            color: white;
            text-decoration: none;
            font-size: 16px;
            background: rgba(0,0,0,0.5);
            padding: 8px 14px;
            border-radius: 8px;
            transition: all 0.3s;
            z-index: 20;
            backdrop-filter: blur(4px);
        }

        .back-link:hover {
            background: rgba(0,0,0,0.7);
            transform: translateX(-3px);
        }

        .fullscreen-btn {
            position: absolute;
            top: 15px; right: 15px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            z-index: 20;
            backdrop-filter: blur(4px);
        }

        .fullscreen-btn:hover {
            background: rgba(0,0,0,0.7);
        }

        @media (max-width: 500px) {
            .score { font-size: 36px; }
            .start-screen h1, .game-over-screen h1 { font-size: 32px; }
            .start-screen p, .game-over-screen p { font-size: 14px; }
            .btn { font-size: 18px; padding: 12px 28px; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <div class="ui">
            <div class="score" id="score">0</div>

            <div class="start-screen" id="startScreen">
                <h1>Flappy Bird</h1>
                <p>Druecke LEERTASTE oder tippe, um zu fliegen!<br>Vermeide die Roehren und sammle Punkte!</p>
                <button class="btn" id="startBtn">Spiel starten</button>
                <div class="high-score" id="startHighScore">Highscore: 0</div>
            </div>

            <div class="game-over-screen" id="gameOverScreen" style="display: none;">
                <h1>Game Over!</h1>
                <div class="score-display" id="finalScoreDisplay">0</div>
                <p id="finalScore">Punkte</p>
                <div class="new-record" id="newRecord">NEUER HIGHSCORE!</div>
                <div class="high-score" id="gameOverHighScore">Highscore: 0</div>
                <button class="btn" id="restartBtn">Nochmal spielen</button>
            </div>
        </div>

        <a href="../index.html" class="back-link">← GRID OS</a>
        <button class="fullscreen-btn" id="fullscreenBtn">&#x26F6;</button>
    </div>

    <script>
        // === DEBUG MODE ===
        const DEBUG = false;
        if (!DEBUG) {
            const noop = () => {};
            console.log = noop;
            console.warn = noop;
            console.info = noop;
        }

        // === SAFE LOCALSTORAGE ===
        function safeGetItem(key, defaultValue = null) {
            try {
                const item = localStorage.getItem(key);
                return item !== null ? item : defaultValue;
            } catch (error) {
                console.error('LocalStorage not available:', error);
                return defaultValue;
            }
        }

        function safeSetItem(key, value) {
            try {
                localStorage.setItem(key, value);
                return true;
            } catch (error) {
                console.error('LocalStorage not available:', error);
                return false;
            }
        }

        // === EVENT MANAGER ===
        class EventManager {
            constructor() { this.listeners = []; }
            add(element, event, handler, options) {
                element.addEventListener(event, handler, options);
                this.listeners.push({ element, event, handler, options });
            }
            removeAll() {
                this.listeners.forEach(({ element, event, handler, options }) => {
                    element.removeEventListener(event, handler, options);
                });
                this.listeners = [];
            }
        }

        // === SAFE CANVAS ===
        function initCanvas() {
            const c = document.getElementById('gameCanvas');
            if (!c) { console.error('Canvas not found'); return null; }
            const cx = c.getContext('2d');
            if (!cx) { console.error('2D context unavailable'); return null; }
            return { canvas: c, ctx: cx };
        }

        const canvasSetup = initCanvas();
        if (!canvasSetup) {
            alert('Your browser does not support Canvas.');
        }
        const { canvas, ctx } = canvasSetup || {};
        if (!canvas) throw new Error('Canvas init failed');

        const eventManager = new EventManager();

        // DOM elements
        const scoreElement = document.getElementById('score');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreDisplay = document.getElementById('finalScoreDisplay');
        const finalScoreElement = document.getElementById('finalScore');
        const startHighScoreElement = document.getElementById('startHighScore');
        const gameOverHighScoreElement = document.getElementById('gameOverHighScore');
        const newRecordElement = document.getElementById('newRecord');

        // === SOUND SYNTHESIS (Web Audio API) ===
        let audioCtx = null;
        function getAudioCtx() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.error('Web Audio API not available');
                }
            }
            return audioCtx;
        }

        function playSound(type) {
            const ac = getAudioCtx();
            if (!ac) return;
            const now = ac.currentTime;

            if (type === 'flap') {
                // Short high-pitched chirp
                const osc = ac.createOscillator();
                const gain = ac.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.05);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                osc.connect(gain).connect(ac.destination);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === 'score') {
                // Pleasant ding - two harmonics
                [880, 1320].forEach((freq, i) => {
                    const osc = ac.createOscillator();
                    const gain = ac.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.1, now + i * 0.06);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35 + i * 0.06);
                    osc.connect(gain).connect(ac.destination);
                    osc.start(now + i * 0.06);
                    osc.stop(now + 0.4);
                });
            } else if (type === 'death') {
                // Descending buzz
                const osc = ac.createOscillator();
                const gain = ac.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.5);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.linearRampToValueAtTime(0.08, now + 0.15);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc.connect(gain).connect(ac.destination);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'whoosh') {
                // White noise whoosh
                const bufferSize = ac.sampleRate * 0.15;
                const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
                }
                const source = ac.createBufferSource();
                source.buffer = buffer;
                const gain = ac.createGain();
                const filter = ac.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(2000, now);
                filter.Q.setValueAtTime(0.5, now);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                source.connect(filter).connect(gain).connect(ac.destination);
                source.start(now);
                source.stop(now + 0.15);
            }
        }

        // === SCREEN SHAKE ===
        let shakeIntensity = 0;
        let shakeDuration = 0;
        let shakeOffsetX = 0;
        let shakeOffsetY = 0;

        function triggerShake(intensity, duration) {
            shakeIntensity = intensity;
            shakeDuration = duration;
        }

        function updateShake() {
            if (shakeDuration > 0) {
                shakeDuration--;
                shakeOffsetX = (Math.random() - 0.5) * shakeIntensity * 2;
                shakeOffsetY = (Math.random() - 0.5) * shakeIntensity * 2;
                shakeIntensity *= 0.9;
            } else {
                shakeOffsetX = 0;
                shakeOffsetY = 0;
            }
        }

        // === SCORE TWEEN ===
        let scoreTweenScale = 1;
        let scoreTweenVelocity = 0;

        function triggerScoreBump() {
            scoreTweenScale = 1.4;
            scoreTweenVelocity = 0;
        }

        function updateScoreTween() {
            // Spring physics (easeOutElastic approximation)
            const target = 1;
            const stiffness = 0.15;
            const damping = 0.6;
            const force = (target - scoreTweenScale) * stiffness;
            scoreTweenVelocity += force;
            scoreTweenVelocity *= damping;
            scoreTweenScale += scoreTweenVelocity;
            scoreElement.style.transform = 'translateX(-50%) scale(' + scoreTweenScale.toFixed(3) + ')';
        }

        // === SCORE POPUPS ===
        let scorePopups = [];

        function spawnScorePopup(x, y, text) {
            scorePopups.push({
                x, y, text,
                life: 1,
                decay: 1 / 36 // ~600ms at 60fps
            });
        }

        function updateAndDrawScorePopups() {
            for (let i = scorePopups.length - 1; i >= 0; i--) {
                const p = scorePopups[i];
                p.y -= 1.2;
                p.life -= p.decay;
                if (p.life <= 0) {
                    scorePopups.splice(i, 1);
                    continue;
                }
                ctx.globalAlpha = p.life;
                ctx.font = 'bold 22px Segoe UI, Arial';
                ctx.textAlign = 'center';
                ctx.fillStyle = '#ffd700';
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'rgba(255,215,0,0.6)';
                ctx.fillText(p.text, p.x, p.y);
                ctx.shadowBlur = 0;
            }
            ctx.globalAlpha = 1;
            ctx.textAlign = 'start';
        }

        // Game state
        let gameState = 'start';
        let score = 0;
        let highScore = parseInt(safeGetItem('flappyBirdHighScore', '0'));
        let animationId;
        let frameCount = 0;

        // Game constants
        const basePipeSpeed = 2.5;
        const baseGravity = 0.45;
        const speedIncrement = 0.08;

        // Bird
        const bird = {
            x: 100,
            y: canvas.height / 2,
            width: 32,
            height: 26,
            velocity: 0,
            gravity: baseGravity,
            jumpStrength: -7.5,
            rotation: 0,
            wingAngle: 0
        };

        // Particles
        let particles = [];

        // Pipes
        let pipes = [];
        const pipeWidth = 60;
        const pipeGap = 155;

        // Ground
        let groundOffset = 0;
        const groundHeight = 50;

        // Screen flash
        let flashAlpha = 0;

        // Parallax background layers
        let bgClouds = [];
        let bgMountains = [];
        let ambientParticles = [];

        function initBackgroundElements() {
            bgClouds = [];
            for (let i = 0; i < 6; i++) {
                bgClouds.push({
                    x: Math.random() * canvas.width,
                    y: 20 + Math.random() * 120,
                    scale: 0.5 + Math.random() * 0.8,
                    speed: 0.15 + Math.random() * 0.3,
                    opacity: 0.3 + Math.random() * 0.4
                });
            }
            bgMountains = [];
            for (let i = 0; i < 8; i++) {
                bgMountains.push({
                    x: i * 70,
                    height: 40 + Math.random() * 60,
                    width: 60 + Math.random() * 40
                });
            }
        }
        initBackgroundElements();

        // Ambient floating particles (dust motes)
        function spawnAmbientParticle() {
            if (ambientParticles.length < 15) {
                ambientParticles.push({
                    x: canvas.width + 5,
                    y: Math.random() * (canvas.height - groundHeight),
                    radius: 0.5 + Math.random() * 1.5,
                    speed: 0.3 + Math.random() * 0.5,
                    wobble: Math.random() * Math.PI * 2,
                    opacity: 0.2 + Math.random() * 0.3
                });
            }
        }

        function updateHighScoreDisplay() {
            startHighScoreElement.textContent = 'Highscore: ' + highScore;
            gameOverHighScoreElement.textContent = 'Highscore: ' + highScore;
        }

        function getCurrentSpeed() {
            return basePipeSpeed + Math.floor(score / 5) * speedIncrement;
        }

        function getCurrentGravity() {
            return baseGravity + Math.floor(score / 10) * 0.03;
        }

        // === PARTICLE SYSTEM ===
        function spawnParticles(x, y, color, count, spread) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * spread;
                particles.push({
                    x, y,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed - 1,
                    radius: 1.5 + Math.random() * 2.5,
                    color,
                    life: 1,
                    decay: 0.025 + Math.random() * 0.02
                });
            }
        }

        // Feather particles (special shape)
        function spawnFeathers(x, y, count) {
            const featherColors = ['#FFD700', '#FFA500', '#FFF8DC', '#FFEC8B'];
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 2.5;
                particles.push({
                    x, y,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed - 2,
                    radius: 3 + Math.random() * 3,
                    color: featherColors[Math.floor(Math.random() * featherColors.length)],
                    life: 1,
                    decay: 0.012 + Math.random() * 0.01,
                    isFeather: true,
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.2
                });
            }
        }

        function updateAndDrawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.dy += 0.06;
                p.dx *= 0.99;
                p.life -= p.decay;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.globalAlpha = p.life;

                if (p.isFeather) {
                    // Draw feather shape
                    p.rotation += p.rotSpeed;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation);
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, p.radius * p.life, p.radius * 0.3 * p.life, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                } else {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius * p.life, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = p.color;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }
            ctx.globalAlpha = 1;
        }

        // === DRAWING ===
        function drawBird() {
            ctx.save();
            ctx.translate(bird.x + bird.width / 2, bird.y + bird.height / 2);
            ctx.rotate(bird.rotation);

            const w2 = bird.width / 2;
            const h2 = bird.height / 2;

            // Wing animation
            bird.wingAngle = Math.sin(frameCount * 0.15) * 0.4;

            // Bird shadow/glow
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'rgba(255,215,0,0.4)';

            // Body - rounder shape
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.ellipse(0, 0, w2, h2 * 0.85, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#DAA520';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Belly
            ctx.fillStyle = '#FFF8DC';
            ctx.beginPath();
            ctx.ellipse(2, 3, w2 * 0.6, h2 * 0.5, 0, 0, Math.PI * 2);
            ctx.fill();

            // Wing
            ctx.save();
            ctx.rotate(bird.wingAngle);
            ctx.fillStyle = '#FFA500';
            ctx.beginPath();
            ctx.ellipse(-4, -2, w2 * 0.55, h2 * 0.4, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Beak
            ctx.fillStyle = '#FF6347';
            ctx.beginPath();
            ctx.moveTo(w2 - 2, -3);
            ctx.lineTo(w2 + 10, 0);
            ctx.lineTo(w2 - 2, 3);
            ctx.closePath();
            ctx.fill();

            // Eye white
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(w2 * 0.4, -h2 * 0.3, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 0.8;
            ctx.stroke();

            // Pupil (look in direction of movement)
            const pupilOffset = Math.min(bird.velocity * 0.15, 2);
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.arc(w2 * 0.4 + 1.5, -h2 * 0.3 + pupilOffset, 3, 0, Math.PI * 2);
            ctx.fill();

            // Eye shine
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.beginPath();
            ctx.arc(w2 * 0.4 + 0.5, -h2 * 0.3 - 1.5, 1.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawPipe(pipe) {
            const capHeight = 24;
            const capOverhang = 6;

            // Pipe shadow
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.fillRect(pipe.x + 4, 0, pipeWidth, pipe.topHeight);
            ctx.fillRect(pipe.x + 4, pipe.bottomY, pipeWidth, canvas.height - pipe.bottomY);

            // Top pipe body
            const topGrad = ctx.createLinearGradient(pipe.x, 0, pipe.x + pipeWidth, 0);
            topGrad.addColorStop(0, '#1e7030');
            topGrad.addColorStop(0.15, '#2d8a3e');
            topGrad.addColorStop(0.4, '#3cb55b');
            topGrad.addColorStop(0.6, '#2d9a45');
            topGrad.addColorStop(0.85, '#267a35');
            topGrad.addColorStop(1, '#1a5c28');

            ctx.fillStyle = topGrad;
            ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);

            // Top pipe cap
            ctx.fillStyle = topGrad;
            ctx.fillRect(pipe.x - capOverhang, pipe.topHeight - capHeight, pipeWidth + capOverhang * 2, capHeight);
            ctx.strokeStyle = '#145020';
            ctx.lineWidth = 2;
            ctx.strokeRect(pipe.x - capOverhang, pipe.topHeight - capHeight, pipeWidth + capOverhang * 2, capHeight);

            // Pipe highlight line (specular)
            ctx.fillStyle = 'rgba(255,255,255,0.18)';
            ctx.fillRect(pipe.x + 6, 0, 4, pipe.topHeight - capHeight);

            // Dark edge line
            ctx.fillStyle = 'rgba(0,0,0,0.12)';
            ctx.fillRect(pipe.x + pipeWidth - 4, 0, 3, pipe.topHeight - capHeight);

            // Bottom pipe body
            ctx.fillStyle = topGrad;
            ctx.fillRect(pipe.x, pipe.bottomY, pipeWidth, canvas.height - pipe.bottomY);

            // Bottom pipe cap
            ctx.fillRect(pipe.x - capOverhang, pipe.bottomY, pipeWidth + capOverhang * 2, capHeight);
            ctx.strokeRect(pipe.x - capOverhang, pipe.bottomY, pipeWidth + capOverhang * 2, capHeight);

            // Bottom highlight
            ctx.fillStyle = 'rgba(255,255,255,0.18)';
            ctx.fillRect(pipe.x + 6, pipe.bottomY + capHeight, 4, canvas.height - pipe.bottomY - capHeight);

            // Bottom dark edge
            ctx.fillStyle = 'rgba(0,0,0,0.12)';
            ctx.fillRect(pipe.x + pipeWidth - 4, pipe.bottomY + capHeight, 3, canvas.height - pipe.bottomY - capHeight);
        }

        function createPipe() {
            const minTopHeight = 60;
            const maxTopHeight = canvas.height - pipeGap - 60 - groundHeight;
            const topHeight = Math.random() * (maxTopHeight - minTopHeight) + minTopHeight;

            return {
                x: canvas.width,
                topHeight: topHeight,
                bottomY: topHeight + pipeGap,
                passed: false,
                whooshed: false
            };
        }

        function updateBird() {
            if (gameState !== 'playing') return;

            bird.gravity = getCurrentGravity();
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            // Rotation based on velocity (more expressive)
            const targetRotation = bird.velocity * 0.06;
            bird.rotation += (Math.max(Math.min(targetRotation, 1.2), -0.5) - bird.rotation) * 0.15;

            if (bird.y < 0) {
                bird.y = 0;
                bird.velocity = 0;
            }

            // Ground collision
            if (bird.y + bird.height > canvas.height - groundHeight) {
                gameOver();
            }
        }

        function updatePipes() {
            if (gameState !== 'playing') return;

            const currentSpeed = getCurrentSpeed();

            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= currentSpeed;

                // Whoosh sound when bird passes through gap
                if (!pipes[i].whooshed && pipes[i].x + pipeWidth < bird.x + bird.width && pipes[i].x + pipeWidth > bird.x - 10) {
                    pipes[i].whooshed = true;
                    playSound('whoosh');
                }

                if (!pipes[i].passed && pipes[i].x + pipeWidth < bird.x) {
                    pipes[i].passed = true;
                    score++;
                    scoreElement.textContent = score;

                    // Score bump tween
                    triggerScoreBump();

                    // Score sound
                    playSound('score');

                    // Score sparkle particles
                    spawnParticles(bird.x + bird.width, bird.y, '#ffd700', 10, 3);
                    spawnParticles(bird.x + bird.width, bird.y, '#fff', 5, 2);

                    // Score popup
                    spawnScorePopup(bird.x + bird.width + 10, bird.y - 10, '+1');
                }

                if (pipes[i].x + pipeWidth < -10) {
                    pipes.splice(i, 1);
                }
            }

            if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 220) {
                pipes.push(createPipe());
            }
        }

        function checkCollisions() {
            if (gameState !== 'playing') return;

            for (let pipe of pipes) {
                // Slightly more forgiving hitbox (2px margin)
                const margin = 2;
                if (bird.x + bird.width - margin > pipe.x &&
                    bird.x + margin < pipe.x + pipeWidth &&
                    (bird.y + margin < pipe.topHeight || bird.y + bird.height - margin > pipe.bottomY)) {
                    gameOver();
                    return;
                }
            }
        }

        function drawBackground() {
            // Sky gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height - groundHeight);
            gradient.addColorStop(0, '#3a7bd5');
            gradient.addColorStop(0.4, '#6db3f2');
            gradient.addColorStop(0.7, '#87CEEB');
            gradient.addColorStop(1, '#c8e6c0');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height - groundHeight);

            // Far mountains (parallax layer 1)
            ctx.fillStyle = 'rgba(100,140,180,0.25)';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - groundHeight);
            for (let i = 0; i < bgMountains.length; i++) {
                const m = bgMountains[i];
                const x = ((m.x - frameCount * 0.15) % (canvas.width + 100) + canvas.width + 100) % (canvas.width + 100) - 50;
                ctx.lineTo(x, canvas.height - groundHeight - m.height * 0.6);
                ctx.lineTo(x + m.width * 0.5, canvas.height - groundHeight - m.height * 0.3);
            }
            ctx.lineTo(canvas.width, canvas.height - groundHeight);
            ctx.closePath();
            ctx.fill();

            // Clouds (parallax layer 2)
            for (let cloud of bgClouds) {
                cloud.x -= cloud.speed;
                if (cloud.x < -80) cloud.x = canvas.width + 40;

                ctx.globalAlpha = cloud.opacity;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                const cx = cloud.x;
                const cy = cloud.y;
                const s = cloud.scale;

                ctx.beginPath();
                ctx.arc(cx, cy, 15 * s, 0, Math.PI * 2);
                ctx.arc(cx + 18 * s, cy - 5 * s, 20 * s, 0, Math.PI * 2);
                ctx.arc(cx + 38 * s, cy, 15 * s, 0, Math.PI * 2);
                ctx.arc(cx + 20 * s, cy + 4 * s, 12 * s, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Ambient floating particles
            if (frameCount % 15 === 0) spawnAmbientParticle();
            for (let i = ambientParticles.length - 1; i >= 0; i--) {
                const ap = ambientParticles[i];
                ap.x -= ap.speed + getCurrentSpeed() * 0.3;
                ap.wobble += 0.03;
                ap.y += Math.sin(ap.wobble) * 0.3;

                if (ap.x < -5) {
                    ambientParticles.splice(i, 1);
                    continue;
                }

                ctx.globalAlpha = ap.opacity;
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.beginPath();
                ctx.arc(ap.x, ap.y, ap.radius, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Ground
            const groundGrad = ctx.createLinearGradient(0, canvas.height - groundHeight, 0, canvas.height);
            groundGrad.addColorStop(0, '#8B6914');
            groundGrad.addColorStop(0.08, '#7CFC00');
            groundGrad.addColorStop(0.15, '#5cb85c');
            groundGrad.addColorStop(0.3, '#228B22');
            groundGrad.addColorStop(1, '#1a5c1a');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);

            // Ground texture lines
            groundOffset = (groundOffset + getCurrentSpeed()) % 20;
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.lineWidth = 1;
            for (let i = -1; i < canvas.width / 20 + 2; i++) {
                const gx = i * 20 - groundOffset;
                ctx.beginPath();
                ctx.moveTo(gx, canvas.height - groundHeight + 8);
                ctx.lineTo(gx + 10, canvas.height);
                ctx.stroke();
            }

            // Ground top highlight
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, 2);
        }

        function draw() {
            ctx.save();

            // Apply screen shake
            if (shakeOffsetX !== 0 || shakeOffsetY !== 0) {
                ctx.translate(shakeOffsetX, shakeOffsetY);
            }

            ctx.clearRect(-10, -10, canvas.width + 20, canvas.height + 20);
            drawBackground();
            pipes.forEach(drawPipe);
            drawBird();
            updateAndDrawParticles();
            updateAndDrawScorePopups();

            // Death flash
            if (flashAlpha > 0) {
                ctx.fillStyle = 'rgba(255,255,255,' + flashAlpha + ')';
                ctx.fillRect(-10, -10, canvas.width + 20, canvas.height + 20);
                flashAlpha -= 0.04;
            }

            ctx.restore();
        }

        function gameLoop() {
            frameCount++;
            updateShake();
            updateScoreTween();
            updateBird();
            updatePipes();
            checkCollisions();
            draw();

            if (gameState === 'playing') {
                animationId = requestAnimationFrame(gameLoop);
            }
        }

        function jump() {
            if (gameState === 'playing') {
                bird.velocity = bird.jumpStrength;
                playSound('flap');
                // Feather particles on flap
                spawnFeathers(bird.x + bird.width * 0.3, bird.y + bird.height * 0.7, 3);
                // Small wing puff
                spawnParticles(bird.x, bird.y + bird.height / 2, 'rgba(255,255,255,0.5)', 2, 1.5);
            }
        }

        function startGame() {
            // Ensure audio context is created on user gesture
            getAudioCtx();

            gameState = 'playing';
            score = 0;
            scoreElement.textContent = score;
            frameCount = 0;
            flashAlpha = 0;
            particles = [];
            scorePopups = [];
            ambientParticles = [];
            scoreTweenScale = 1;
            scoreTweenVelocity = 0;
            shakeIntensity = 0;
            shakeDuration = 0;

            bird.x = 100;
            bird.y = canvas.height / 2;
            bird.velocity = 0;
            bird.rotation = 0;
            bird.gravity = baseGravity;

            pipes = [];
            groundOffset = 0;

            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            gameOverScreen.classList.remove('visible');

            initBackgroundElements();

            // Small delay before first pipe
            setTimeout(() => {
                if (gameState === 'playing') pipes.push(createPipe());
            }, 500);

            gameLoop();
        }

        function gameOver() {
            gameState = 'gameOver';
            flashAlpha = 0.7;

            // Screen shake on death
            triggerShake(8, 20);

            // Death sound
            playSound('death');

            // Death burst - feathers and colored particles
            spawnFeathers(bird.x + bird.width / 2, bird.y + bird.height / 2, 12);
            spawnParticles(bird.x + bird.width / 2, bird.y + bird.height / 2, '#FFD700', 15, 5);
            spawnParticles(bird.x + bird.width / 2, bird.y + bird.height / 2, '#FF6347', 10, 4);
            spawnParticles(bird.x + bird.width / 2, bird.y + bird.height / 2, '#fff', 8, 3);

            const isNewRecord = score > highScore;
            if (isNewRecord) {
                highScore = score;
                safeSetItem('flappyBirdHighScore', highScore.toString());
            }

            // Continue rendering particles briefly
            let deathFrames = 0;
            function deathAnimation() {
                deathFrames++;
                updateShake();
                draw();
                if (deathFrames < 30) {
                    requestAnimationFrame(deathAnimation);
                } else {
                    showGameOver(isNewRecord);
                }
            }
            deathAnimation();

            if (animationId) cancelAnimationFrame(animationId);
        }

        function showGameOver(isNewRecord) {
            finalScoreDisplay.textContent = score;
            finalScoreElement.textContent = 'Punkte';
            updateHighScoreDisplay();

            if (isNewRecord && score > 0) {
                newRecordElement.classList.add('visible');
            } else {
                newRecordElement.classList.remove('visible');
            }

            gameOverScreen.style.display = 'flex';
            // Trigger slide-in animation on next frame
            requestAnimationFrame(() => {
                gameOverScreen.classList.add('visible');
            });
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }

        // === EVENT BINDING ===
        function initEvents() {
            eventManager.removeAll();

            eventManager.add(document, 'keydown', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    if (gameState === 'start') startGame();
                    else if (gameState === 'playing') jump();
                    else if (gameState === 'gameOver') startGame();
                }
            });

            eventManager.add(canvas, 'click', () => {
                if (gameState === 'playing') jump();
            });

            eventManager.add(canvas, 'touchstart', (e) => {
                e.preventDefault();
                if (gameState === 'playing') jump();
            });

            eventManager.add(document.getElementById('startBtn'), 'click', startGame);
            eventManager.add(document.getElementById('restartBtn'), 'click', startGame);
            eventManager.add(document.getElementById('fullscreenBtn'), 'click', toggleFullscreen);
        }

        // === INIT ===
        updateHighScoreDisplay();
        initEvents();
        draw();
    </script>
</body>
</html>

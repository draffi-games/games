<style>
/* ============================================================
   GRID OS — Token layer (from docs/design-system.md)
   Themes swap via [data-theme] custom-property overrides.
   ============================================================ */
:root{
  /* surfaces */
  --bg-void:#000000;
  --bg-deep:#0a0a0f;
  --bg-panel:#0d0d16;
  --bg-card:rgba(20,20,30,0.92);
  --bg-card-hover:rgba(28,30,44,0.95);
  --line:rgba(255,255,255,0.08);
  --line-strong:rgba(255,255,255,0.14);

  /* text */
  --text-primary:#f4f6fb;
  --text-secondary:#c3c9d6;
  --text-muted:#7d8597;
  --text-disabled:#4a5060;

  /* accent (theme-driven) — default: Flynn / cyan */
  --accent:#00d9ff;
  --accent-rgb:0,217,255;
  --accent-soft:rgba(0,217,255,0.12);

  /* category accent families (design-system) */
  --cat-action:#f43f5e;        --cat-action-rgb:244,63,94;
  --cat-strategie:#f0b429;     --cat-strategie-rgb:240,180,41;
  --cat-arcade:#22d3ee;        --cat-arcade-rgb:34,211,238;
  --cat-mehrspieler:#34d399;   --cat-mehrspieler-rgb:52,211,153;
  --cat-simulation:#a78bfa;    --cat-simulation-rgb:167,139,250;
  --cat-tron:#00ff41;          --cat-tron-rgb:0,255,65;
  --cat-alle:var(--accent);    --cat-alle-rgb:var(--accent-rgb);

  /* status */
  --ok:#34d399;
  --warn:#f0b429;

  /* spacing — 8px grid + 4px half-step */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px;
  --s6:24px; --s8:32px; --s12:48px; --s16:64px;

  /* radii / motion */
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --d-fast:140ms; --d-normal:240ms; --d-slow:420ms;
  --ease:cubic-bezier(0.4,0,0.2,1);

  /* type */
  --mono:ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;

  --rail-w:248px;
}

/* ---- Themes (CSS custom-property swap) ---- */
[data-theme="flynn"]{ --accent:#00d9ff; --accent-rgb:0,217,255;  --accent-soft:rgba(0,217,255,0.12); }
[data-theme="encom"]{ --accent:#00ff41; --accent-rgb:0,255,65;   --accent-soft:rgba(0,255,65,0.12); --bg-deep:#060a06; --bg-panel:#08110a; }
[data-theme="amber"]{ --accent:#f0b429; --accent-rgb:240,180,41; --accent-soft:rgba(240,180,41,0.14); --bg-deep:#0f0c06; --bg-panel:#15110a; }
[data-theme="violet"]{--accent:#8b7bf0; --accent-rgb:139,123,240; --accent-soft:rgba(139,123,240,0.14); --bg-deep:#0a0a14; --bg-panel:#0e0e1c; }

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
body{
  background:var(--bg-deep);
  color:var(--text-secondary);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.5;
  min-height:100vh;
  overflow-x:hidden;
}

/* ============================================================
   ONE coherent effect layer: a faint grid + a single slow
   scanline drift. No particles, no glitch, no 3D-tilt.
   ============================================================ */
.fx{position:fixed;inset:0;z-index:0;pointer-events:none;}
.fx-grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(var(--accent-rgb),0.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(var(--accent-rgb),0.045) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse 120% 80% at 50% 0%,#000 30%,transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse 120% 80% at 50% 0%,#000 30%,transparent 78%);
}
.fx-scan{
  position:absolute;inset:0;
  background:linear-gradient(180deg,transparent,rgba(var(--accent-rgb),0.05) 50%,transparent);
  height:160px;
  animation:scanDrift 9s linear infinite;
  opacity:0.6;
}
@keyframes scanDrift{0%{transform:translateY(-180px);}100%{transform:translateY(100vh);}}
.fx-vignette{
  position:absolute;inset:0;
  background:radial-gradient(ellipse 90% 70% at 50% 40%,transparent 55%,rgba(0,0,0,0.55) 100%);
}

/* ============================================================
   App shell
   ============================================================ */
.os{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;}

/* ---- Status bar ---- */
.statusbar{
  position:sticky;top:0;z-index:60;
  display:flex;align-items:center;gap:var(--s4);
  height:56px;padding:0 var(--s5);
  background:rgba(10,10,15,0.82);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:var(--s3);text-decoration:none;color:inherit;flex-shrink:0;}
.brand-mark{
  width:30px;height:30px;border-radius:var(--r-sm);
  border:1.5px solid var(--accent);
  display:grid;place-items:center;
  font-family:var(--mono);font-weight:700;font-size:15px;color:var(--accent);
  box-shadow:0 0 14px rgba(var(--accent-rgb),0.35);
}
.brand-name{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:0.12em;color:var(--text-primary);}
.brand-name b{color:var(--accent);}
.brand-sub{font-family:var(--mono);font-size:10px;letter-spacing:0.28em;color:var(--text-muted);text-transform:uppercase;}

.search{position:relative;flex:1;max-width:420px;margin-left:auto;}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;}
.search input{
  width:100%;height:36px;padding:0 14px 0 36px;
  border:1px solid var(--line-strong);border-radius:var(--r-sm);
  background:rgba(255,255,255,0.03);color:var(--text-primary);
  font-family:var(--mono);font-size:13px;outline:none;
  transition:border-color var(--d-fast) var(--ease),box-shadow var(--d-fast) var(--ease);
}
.search input::placeholder{color:var(--text-muted);}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),0.14);}

.status-line{
  display:none;font-family:var(--mono);font-size:11px;letter-spacing:0.1em;
  color:var(--text-muted);white-space:nowrap;flex-shrink:0;
}
.status-line .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:7px;box-shadow:0 0 8px var(--ok);vertical-align:middle;animation:blink 2.4s var(--ease) infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.45;}}
.status-line b{color:var(--accent);}

.themes{display:flex;gap:var(--s2);flex-shrink:0;}
.swatch{
  width:18px;height:18px;border-radius:50%;border:1.5px solid transparent;cursor:pointer;padding:0;
  transition:transform var(--d-fast) var(--ease),border-color var(--d-fast) var(--ease);
}
.swatch:hover{transform:scale(1.18);}
.swatch[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,0.15);}
.swatch:focus-visible{outline:2px solid #fff;outline-offset:2px;}

.menu-btn{
  display:none;width:36px;height:36px;flex-shrink:0;
  border:1px solid var(--line-strong);border-radius:var(--r-sm);
  background:rgba(255,255,255,0.03);color:var(--text-secondary);cursor:pointer;
  align-items:center;justify-content:center;
}

/* ---- Body layout ---- */
.shell{display:flex;flex:1;min-height:0;}

/* ---- Left rail / workspaces ---- */
.rail{
  width:var(--rail-w);flex-shrink:0;
  border-right:1px solid var(--line);
  padding:var(--s5) var(--s4) var(--s8);
  position:sticky;top:56px;align-self:flex-start;
  height:calc(100vh - 56px);overflow-y:auto;
}
.rail-label{
  font-family:var(--mono);font-size:10px;letter-spacing:0.26em;text-transform:uppercase;
  color:var(--text-muted);padding:0 var(--s3);margin-bottom:var(--s3);
}
.ws-list{list-style:none;display:flex;flex-direction:column;gap:2px;}
.ws{
  display:flex;align-items:center;gap:var(--s3);width:100%;
  padding:9px var(--s3);border:none;border-radius:var(--r-sm);
  background:transparent;color:var(--text-secondary);cursor:pointer;
  font-family:var(--sans);font-size:14px;text-align:left;
  position:relative;transition:background var(--d-fast) var(--ease),color var(--d-fast) var(--ease);
}
.ws::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%) scaleY(0);
  width:3px;height:60%;border-radius:2px;background:var(--ws-c,var(--accent));
  transition:transform var(--d-fast) var(--ease);
}
.ws .ws-dot{width:8px;height:8px;border-radius:2px;background:var(--ws-c,var(--accent));flex-shrink:0;box-shadow:0 0 6px rgba(var(--ws-rgb,var(--accent-rgb)),0.6);}
.ws .ws-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ws .ws-count{font-family:var(--mono);font-size:11px;color:var(--text-muted);}
.ws:hover{background:rgba(255,255,255,0.035);color:var(--text-primary);}
.ws[aria-pressed="true"]{background:rgba(var(--ws-rgb,var(--accent-rgb)),0.1);color:var(--text-primary);}
.ws[aria-pressed="true"]::before{transform:translateY(-50%) scaleY(1);}
.ws[aria-pressed="true"] .ws-count{color:var(--ws-c,var(--accent));}
.ws:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}

.rail-foot{margin-top:var(--s6);padding:var(--s3);border-top:1px solid var(--line);
  font-family:var(--mono);font-size:10px;line-height:1.7;color:var(--text-disabled);letter-spacing:0.06em;}
.rail-foot b{color:var(--text-muted);}

/* ---- Main / program list ---- */
.main{flex:1;min-width:0;padding:var(--s6) var(--s8) var(--s16);}
.main-head{display:flex;align-items:baseline;gap:var(--s4);margin-bottom:var(--s5);flex-wrap:wrap;}
.main-title{font-family:var(--mono);font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-primary);}
.main-title span{color:var(--accent);}
.main-meta{font-family:var(--mono);font-size:11px;color:var(--text-muted);letter-spacing:0.08em;}

.grid{
  display:grid;gap:var(--s4);
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
}

/* ---- Program card ---- */
.prg{
  position:relative;display:flex;flex-direction:column;gap:var(--s3);
  padding:var(--s5);
  background:var(--bg-card);
  border:1px solid var(--line);border-radius:var(--r-md);
  text-decoration:none;color:inherit;
  border-left:3px solid rgba(var(--c-rgb,var(--accent-rgb)),0.55);
  transition:border-color var(--d-fast) var(--ease),background var(--d-fast) var(--ease),transform var(--d-fast) var(--ease),box-shadow var(--d-fast) var(--ease);
}
.prg:hover,.prg:focus-visible{
  background:var(--bg-card-hover);
  border-color:var(--line-strong);border-left-color:var(--c,var(--accent));
  transform:translateY(-3px);
  box-shadow:0 14px 34px rgba(0,0,0,0.45),0 0 0 1px rgba(var(--c-rgb,var(--accent-rgb)),0.25);
  outline:none;
}
.prg:focus-visible{box-shadow:0 0 0 2px var(--c,var(--accent)),0 14px 34px rgba(0,0,0,0.45);}
.prg-top{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);}
.prg-id{font-family:var(--mono);font-size:10px;letter-spacing:0.18em;color:var(--text-muted);}
.prg-cat{
  font-family:var(--mono);font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
  padding:3px 8px;border-radius:100px;white-space:nowrap;
  color:var(--c,var(--accent));
  background:rgba(var(--c-rgb,var(--accent-rgb)),0.1);
  border:1px solid rgba(var(--c-rgb,var(--accent-rgb)),0.28);
}
.prg-icon{
  font-size:30px;line-height:1;width:48px;height:48px;border-radius:var(--r-sm);
  display:grid;place-items:center;
  background:rgba(var(--c-rgb,var(--accent-rgb)),0.07);
  border:1px solid rgba(var(--c-rgb,var(--accent-rgb)),0.16);
}
.prg-title{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:0.01em;color:var(--text-primary);line-height:1.25;}
.prg-desc{
  font-size:13px;color:var(--text-muted);line-height:1.5;flex:1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.prg-tags{display:flex;gap:6px;flex-wrap:wrap;}
.prg-tag{font-family:var(--mono);font-size:9px;letter-spacing:0.08em;color:var(--text-disabled);}
.prg-tag::before{content:'#';opacity:0.6;}
.prg-exec{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:var(--s2);padding-top:var(--s3);border-top:1px solid var(--line);
}
.prg-exec .label{
  font-family:var(--mono);font-size:11px;letter-spacing:0.16em;font-weight:700;
  color:var(--c,var(--accent));text-transform:uppercase;
}
.prg-exec .arrow{font-family:var(--mono);color:var(--c,var(--accent));transition:transform var(--d-fast) var(--ease);}
.prg:hover .prg-exec .arrow,.prg:focus-visible .prg-exec .arrow{transform:translateX(4px);}

.prg.hide{display:none;}

.empty{grid-column:1/-1;text-align:center;padding:var(--s16) var(--s4);color:var(--text-muted);}
.empty-code{font-family:var(--mono);font-size:13px;letter-spacing:0.1em;color:var(--text-disabled);}
.empty-code b{color:var(--accent);}

/* ---- Footer ---- */
.os-foot{
  padding:var(--s6) var(--s8);border-top:1px solid var(--line);
  font-family:var(--mono);font-size:11px;letter-spacing:0.08em;color:var(--text-disabled);
  display:flex;justify-content:space-between;gap:var(--s4);flex-wrap:wrap;
}
.os-foot b{color:var(--text-muted);}

/* ============================================================
   Boot sequence (skippable, remembered)
   ============================================================ */
.boot{
  position:fixed;inset:0;z-index:200;
  background:var(--bg-void);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.boot[hidden]{display:none;}
.boot-inner{width:min(440px,80vw);font-family:var(--mono);}
.boot-logo{
  font-size:13px;letter-spacing:0.5em;color:var(--accent);text-align:center;
  text-shadow:0 0 18px rgba(var(--accent-rgb),0.6);margin-bottom:var(--s6);
}
.boot-log{font-size:11px;line-height:1.9;color:var(--text-muted);min-height:90px;}
.boot-log .ok{color:var(--ok);}
.boot-bar{height:2px;background:rgba(var(--accent-rgb),0.18);border-radius:2px;margin-top:var(--s5);overflow:hidden;}
.boot-bar i{display:block;height:100%;width:0;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:bootFill 1.2s var(--ease) forwards;}
@keyframes bootFill{to{width:100%;}}
.boot-skip{text-align:center;margin-top:var(--s5);font-size:10px;letter-spacing:0.2em;color:var(--text-disabled);}

/* ---- Mobile ---- */
@media(max-width:860px){
  .rail{
    position:fixed;top:56px;left:0;z-index:55;
    width:min(300px,84vw);height:calc(100vh - 56px);
    background:var(--bg-panel);
    transform:translateX(-105%);transition:transform var(--d-normal) var(--ease);
    box-shadow:18px 0 50px rgba(0,0,0,0.5);
  }
  body.rail-open .rail{transform:translateX(0);}
  .rail-scrim{
    position:fixed;inset:56px 0 0;z-index:54;background:rgba(0,0,0,0.55);
    opacity:0;pointer-events:none;transition:opacity var(--d-normal) var(--ease);
  }
  body.rail-open .rail-scrim{opacity:1;pointer-events:auto;}
  .menu-btn{display:flex;}
  .main{padding:var(--s5) var(--s4) var(--s16);}
  .brand-sub{display:none;}
  .search{max-width:none;}
}
@media(min-width:1180px){.status-line{display:block;}}
@media(max-width:560px){
  .statusbar{gap:var(--s3);padding:0 var(--s4);}
  .grid{grid-template-columns:1fr;}
  .swatch:nth-child(n+4){display:none;}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0.001ms!important;animation-iteration-count:1!important;transition-duration:0.001ms!important;}
  .fx-scan{display:none;}
  .boot{display:none!important;}
}
</style>
</head>
<body>

<!-- Single coherent effect layer -->
<div class="fx" aria-hidden="true">
  <div class="fx-grid"></div>
  <div class="fx-scan"></div>
  <div class="fx-vignette"></div>
</div>

<!-- Boot sequence (skippable; remembers skip in localStorage) -->
<div class="boot" id="boot" hidden role="dialog" aria-label="GRID OS Boot" tabindex="-1">
  <div class="boot-inner">
    <div class="boot-logo">G R I D&nbsp;&nbsp;O S</div>
    <div class="boot-log" id="bootLog"></div>
    <div class="boot-bar"><i></i></div>
    <div class="boot-skip">DRÜCKE EINE TASTE ZUM ÜBERSPRINGEN</div>
  </div>
</div>

<div class="os">
  <!-- Status bar -->
  <header class="statusbar">
    <button class="menu-btn" id="menuBtn" aria-label="Workspaces öffnen" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <a href="index.html" class="brand" aria-label="GRID OS Startseite">
      <span class="brand-mark">G</span>
      <span>
        <span class="brand-name">GRID<b>OS</b></span><br>
        <span class="brand-sub">DRAFI Launcher</span>
      </span>
    </a>

    <div class="search" role="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" id="search" placeholder="Programme durchsuchen…  ( / )" aria-label="Programme nach Titel oder Beschreibung durchsuchen" autocomplete="off">
    </div>

    <div class="status-line" id="statusLine" aria-live="polite"></div>

    <div class="themes" role="group" aria-label="Theme wechseln">
      <button class="swatch" data-theme="flynn"  style="background:#00d9ff" aria-label="Theme Flynn (Cyan)"  title="Flynn"></button>
      <button class="swatch" data-theme="encom"  style="background:#00ff41" aria-label="Theme ENCOM (Grün)"  title="ENCOM"></button>
      <button class="swatch" data-theme="amber"  style="background:#f0b429" aria-label="Theme Amber (Gold)"  title="Amber"></button>
      <button class="swatch" data-theme="violet" style="background:#8b7bf0" aria-label="Theme Violet"        title="Violet"></button>
    </div>
  </header>

  <div class="shell">
    <div class="rail-scrim" id="railScrim" aria-hidden="true"></div>

    <!-- Left rail: category workspaces -->
    <nav class="rail" id="rail" aria-label="Kategorie-Workspaces">
      <p class="rail-label">Workspaces</p>
      <ul class="ws-list" id="wsList"></ul>
      <div class="rail-foot">
        <b>GRID OS v3.0</b><br>
        Alle Programme KI-generiert.<br>
        Direktstart im Browser.
      </div>
    </nav>

    <!-- Main: program list -->
    <main class="main">
      <div class="main-head">
        <h1 class="main-title" id="mainTitle">// <span>ALLE</span></h1>
        <span class="main-meta" id="mainMeta"></span>
      </div>
      <div class="grid" id="grid" role="list" aria-label="Programmliste"></div>
    </main>
  </div>

  <footer class="os-foot">
    <span><b>DRAFI · GRID OS</b> — KI-generierte Browser-Spiele, sofort spielbar.</span>
    <span id="footStat"></span>
  </footer>
</div>

<script>
"use strict";

/* ---- Category workspaces (built from the tags present) ---- */
var CATS=[
  {key:"alle",       label:"ALLE / ALL"},
  {key:"action",     label:"Action"},
  {key:"strategie",  label:"Strategie"},
  {key:"arcade",     label:"Arcade"},
  {key:"mehrspieler",label:"Mehrspieler"},
  {key:"simulation", label:"Simulation"},
  {key:"tron",       label:"Tron"}
];

/* Per-game primary category for the badge / left-border colour:
   the first tag that is itself a workspace key. */
function primaryCat(g){
  var keys=["action","strategie","arcade","mehrspieler","simulation","tron"];
  for(var i=0;i<g.tags.length;i++){ if(keys.indexOf(g.tags[i])>-1) return g.tags[i]; }
  return "alle";
}

/* counts per category */
var counts={alle:games.length};
games.forEach(function(g){
  g.tags.forEach(function(t){ if(t!=="3d") counts[t]=(counts[t]||0)+1; });
});

var state={cat:"alle",q:""};
var pad=function(n){return (n<10?"0":"")+n;};

/* ============================================================
   Render: workspaces
   ============================================================ */
function renderWorkspaces(){
  var ul=document.getElementById("wsList");
  ul.innerHTML="";
  CATS.forEach(function(c){
    var li=document.createElement("li");
    var b=document.createElement("button");
    b.className="ws";
    b.type="button";
    b.dataset.cat=c.key;
    b.style.setProperty("--ws-c","var(--cat-"+c.key+")");
    b.style.setProperty("--ws-rgb","var(--cat-"+c.key+"-rgb)");
    b.setAttribute("aria-pressed", c.key===state.cat ? "true":"false");
    b.innerHTML='<span class="ws-dot"></span><span class="ws-name">'+c.label+'</span><span class="ws-count">'+(counts[c.key]||0)+'</span>';
    b.addEventListener("click",function(){ setCat(c.key); closeRail(); });
    li.appendChild(b);
    ul.appendChild(li);
  });
}

function setCat(key){
  state.cat=key;
  document.querySelectorAll(".ws").forEach(function(b){
    b.setAttribute("aria-pressed", b.dataset.cat===key ? "true":"false");
  });
  var label=CATS.filter(function(c){return c.key===key;})[0].label;
  var titleEl=document.getElementById("mainTitle");
  titleEl.innerHTML="// <span>"+escapeHtml(label.toUpperCase())+"</span>";
  // recolor the accent of the main title region via the active category
  titleEl.style.setProperty("--accent", key==="alle"?"":"var(--cat-"+key+")");
  apply();
}

/* ============================================================
   Render: program cards
   ============================================================ */
function escapeHtml(s){
  return String(s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}

function renderCards(){
  var grid=document.getElementById("grid");
  grid.innerHTML="";
  games.forEach(function(g,i){
    var cat=primaryCat(g);
    var a=document.createElement("a");
    a.className="prg";
    a.href=g.url;                                  /* full-page navigation, NOT iframe */
    a.setAttribute("role","listitem");
    a.style.setProperty("--c","var(--cat-"+cat+")");
    a.style.setProperty("--c-rgb","var(--cat-"+cat+"-rgb)");
    a.dataset.search=(g.title+" "+g.desc+" "+g.tags.join(" ")).toLowerCase();
    a.dataset.tags=g.tags.join(",");
    a.setAttribute("aria-label","EXECUTE "+g.title+" — "+g.desc);

    var tagsHtml=g.tags.map(function(t){return '<span class="prg-tag">'+escapeHtml(t)+'</span>';}).join("");

    a.innerHTML=
      '<div class="prg-top">'+
        '<span class="prg-id">PRG_'+pad(i+1)+'</span>'+
        '<span class="prg-cat">'+escapeHtml(cat==="alle"?"misc":cat)+'</span>'+
      '</div>'+
      '<div class="prg-icon" aria-hidden="true">'+g.icon+'</div>'+
      '<div class="prg-title">'+escapeHtml(g.title)+'</div>'+
      '<div class="prg-desc">'+escapeHtml(g.desc)+'</div>'+
      '<div class="prg-tags">'+tagsHtml+'</div>'+
      '<div class="prg-exec"><span class="label">▸ Execute</span><span class="arrow" aria-hidden="true">→</span></div>';

    grid.appendChild(a);
  });
  // empty-state node (kept hidden until needed)
  var empty=document.createElement("div");
  empty.className="empty";
  empty.id="empty";
  empty.style.display="none";
  empty.innerHTML='<div class="empty-code">// <b>NO_PROGRAM_MATCH</b> — Filter zurücksetzen mit <b>ESC</b></div>';
  grid.appendChild(empty);
}

/* ============================================================
   Filter + search
   ============================================================ */
function apply(){
  var cards=document.querySelectorAll(".prg");
  var q=state.q.toLowerCase().trim();
  var n=0;
  cards.forEach(function(c){
    var matchCat=(state.cat==="alle")||(","+c.dataset.tags+",").indexOf(","+state.cat+",")>-1;
    var matchQ=!q||c.dataset.search.indexOf(q)>-1;
    if(matchCat&&matchQ){c.classList.remove("hide");n++;}
    else{c.classList.add("hide");}
  });
  document.getElementById("empty").style.display=n?"none":"block";
  updateMeta(n);
}

function updateMeta(n){
  var meta=document.getElementById("mainMeta");
  var word=n===1?"PROGRAMM":"PROGRAMME";
  var suffix=state.q?(' · "'+escapeHtml(state.q)+'"'):"";
  meta.textContent=pad(n)+" "+word+suffix;
}

/* ============================================================
   Status line + footer
   ============================================================ */
function renderStatus(){
  document.getElementById("statusLine").innerHTML=
    '<span class="dot"></span>ONLINE · <b>'+games.length+'</b> PROGRAMS · GRID 100%';
  document.getElementById("footStat").innerHTML=
    'ONLINE · '+games.length+' PROGRAMS · '+(CATS.length-1)+' WORKSPACES';
}

/* ============================================================
   Theme switch (persisted)
   ============================================================ */
function setTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  document.querySelectorAll(".swatch").forEach(function(s){
    s.setAttribute("aria-pressed", s.dataset.theme===t ? "true":"false");
  });
  try{localStorage.setItem("gridos.theme",t);}catch(e){}
}

/* ============================================================
   Mobile rail drawer
   ============================================================ */
function openRail(){document.body.classList.add("rail-open");document.getElementById("menuBtn").setAttribute("aria-expanded","true");}
function closeRail(){document.body.classList.remove("rail-open");document.getElementById("menuBtn").setAttribute("aria-expanded","false");}

/* ============================================================
   Boot sequence (skippable, remembered)
   ============================================================ */
function runBoot(){
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var seen=false;
  try{seen=localStorage.getItem("gridos.booted")==="1";}catch(e){}
  if(seen||reduce) return;

  var boot=document.getElementById("boot");
  var log=document.getElementById("bootLog");
  boot.hidden=false;
  boot.focus();

  var lines=[
    "GRID OS · kernel init …",
    "mount /programs … <span class='ok'>"+games.length+" found</span>",
    "load workspaces … <span class='ok'>"+(CATS.length-1)+" ready</span>",
    "render pipeline … <span class='ok'>OK</span>",
    "<span class='ok'>SYSTEM ONLINE</span>"
  ];
  var i=0;
  var iv=setInterval(function(){
    if(i<lines.length){ log.innerHTML+=(i?"<br>":"")+"&gt; "+lines[i]; i++; }
  },220);

  var done=false;
  function finish(){
    if(done)return; done=true;
    clearInterval(iv);
    try{localStorage.setItem("gridos.booted","1");}catch(e){}
    boot.hidden=true;
    document.getElementById("search").blur();
  }
  // auto-finish under 1.5s, or skip on any key/click
  var timer=setTimeout(finish,1350);
  function skip(){clearTimeout(timer);finish();window.removeEventListener("keydown",skip);boot.removeEventListener("click",skip);}
  window.addEventListener("keydown",skip);
  boot.addEventListener("click",skip);
}

/* ============================================================
   Init
   ============================================================ */
(function init(){
  // restore theme
  var saved="flynn";
  try{saved=localStorage.getItem("gridos.theme")||"flynn";}catch(e){}
  setTheme(saved);

  renderWorkspaces();
  renderCards();
  renderStatus();
  apply();

  // search
  var search=document.getElementById("search");
  search.addEventListener("input",function(e){state.q=e.target.value;apply();});

  // theme swatches
  document.querySelectorAll(".swatch").forEach(function(s){
    s.addEventListener("click",function(){setTheme(s.dataset.theme);});
  });

  // mobile drawer
  document.getElementById("menuBtn").addEventListener("click",function(){
    document.body.classList.contains("rail-open")?closeRail():openRail();
  });
  document.getElementById("railScrim").addEventListener("click",closeRail);

  // keyboard shortcuts
  document.addEventListener("keydown",function(e){
    if(e.key==="/"&&document.activeElement!==search){e.preventDefault();search.focus();}
    if(e.key==="Escape"){
      if(document.body.classList.contains("rail-open")){closeRail();return;}
      search.value="";state.q="";setCat("alle");
    }
  });

  runBoot();
})();
</script>

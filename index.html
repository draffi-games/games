            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);

        /* ==========================================
           Reset & Base

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-body);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ==========================================
           Background Ambient Effect
           ========================================== */
        .ambient-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            animation: orbFloat 20s ease-in-out infinite;
        }

        .ambient-orb:nth-child(1) {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(167, 139, 250, 0.15), transparent 70%);
            top: -200px;
            left: -100px;
        }

        .ambient-orb:nth-child(2) {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.12), transparent 70%);
            top: 50%;
            right: -150px;
            animation-delay: -7s;
            animation-duration: 25s;
        }

        .ambient-orb:nth-child(3) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(129, 140, 248, 0.1), transparent 70%);
            bottom: -100px;
            left: 30%;
            animation-delay: -14s;
            animation-duration: 22s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -40px) scale(1.05); }
            50% { transform: translate(-20px, 20px) scale(0.95); }
            75% { transform: translate(40px, 30px) scale(1.02); }
        }

        /* ==========================================
           Header
           ========================================== */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px) saturate(1.5);

            background: rgba(10, 14, 23, 0.85);
            border-bottom: 1px solid var(--border-subtle);
        }

        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {

            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-primary);
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            background: var(--gradient-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: white;
        }

        }

            border: 1px solid rgba(167, 139, 250, 0.2);

           Main Content
           ========================================== */
        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;

        /* ==========================================
           Filter & Search Bar
           ========================================== */
        .filter-bar {

            -webkit-backdrop-filter: blur(16px) saturate(1.4);
            background: rgba(10, 14, 23, 0.8);
            border-bottom: 1px solid var(--border-subtle);
            padding: 16px 0;
        }

        .filter-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-pills {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex: 1;
        }

        .filter-pill {
            padding: 8px 18px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border-medium);
            background: transparent;
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-base);
            white-space: nowrap;
            user-select: none;
        }

        .filter-pill:hover {
            border-color: var(--accent-primary);
            color: var(--text-primary);
            background: rgba(167, 139, 250, 0.08);
        }

        .filter-pill.active {
            background: var(--gradient-accent);
            border-color: transparent;
            color: white;
            font-weight: 600;
            box-shadow: 0 2px 12px rgba(167, 139, 250, 0.3);
        }

        .search-box {
            position: relative;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: 8px 16px 8px 38px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border-medium);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 14px;
            outline: none;
            transition: all var(--transition-base);
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .search-box input:focus {
            border-color: var(--accent-primary);
            background: rgba(167, 139, 250, 0.06);
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.1);
        }

            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
            pointer-events: none;

            font-weight: 700;

           Game Grid
           ========================================== */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding-bottom: 80px;
        }

        @media (max-width: 1200px) {
            .game-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 800px) {
            .game-grid { grid-template-columns: repeat(2, 1fr); }
            .filter-inner { flex-direction: column; align-items: stretch; }
            .search-box { min-width: unset; }
        }

        @media (max-width: 480px) {
            .game-grid { grid-template-columns: 1fr; gap: 14px; }
        }

            background: linear-gradient(145deg, rgba(167, 139, 250, 0.12), rgba(99, 102, 241, 0.06));

            transform: scale(0.92);
            pointer-events: none;
        }

        }

           No Results
           ========================================== */

            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(10, 14, 23, 0.95);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .launch-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .launch-content {
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s;
        }

        .launch-overlay.active .launch-content {
            transform: scale(1);
        }

        .launch-icon {
            font-size: 64px;
            margin-bottom: 16px;
            animation: launchBounce 0.6s ease-out;
        }

        .launch-text {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        @keyframes launchBounce {
            0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            60% { transform: scale(1.15) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
    </style>
</head>

        // ==========================================
        // Tag display names
        // ==========================================
        const tagLabels = {
            alle: "Alle",
            action: "Action",
            strategie: "Strategie",
            arcade: "Arcade",
            mehrspieler: "Mehrspieler",
            simulation: "Simulation"
        };

        // ==========================================
        // State
        // ==========================================
        let activeFilter = 'alle';
        let searchQuery = '';

        // ==========================================
        // Render filter pills
        // ==========================================
        function renderFilters() {
            const container = document.getElementById('filterPills');
            Object.entries(tagLabels).forEach(([key, label]) => {
                const btn = document.createElement('button');
                btn.className = 'filter-pill' + (key === 'alle' ? ' active' : '');
                btn.textContent = label;
                btn.dataset.filter = key;
                btn.addEventListener('click', () => {
                    activeFilter = key;
                    document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
                    btn.classList.add('active');
                    applyFilters();
                });
                container.appendChild(btn);
            });
        }

        // ==========================================
        // Render game cards
        // ==========================================
        function renderCards() {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';

            games.forEach(game => {
                const card = document.createElement('a');
                card.className = 'game-card';
                card.href = game.url;
                card.dataset.tags = game.tags.join(',');
                card.dataset.search = (game.title + ' ' + game.description).toLowerCase();

                card.addEventListener('click', (e) => {
                    e.preventDefault();
                    launchGame(game.url, game.icon, game.title);
                });

                card.innerHTML = `
                    <div class="card-icon">${game.icon}</div>
                    <div class="card-title">${game.title}</div>
                    <div class="card-desc">${game.description}</div>
                    <div class="card-tags">
                        ${game.tags.map(t => `<span class="card-tag">${tagLabels[t] || t}</span>`).join('')}
                    </div>
                `;

                grid.appendChild(card);
            });

            document.getElementById('totalBadge').textContent = games.length + ' Spiele';
            updateResultsCount(games.length);
        }

        // ==========================================
        // Apply filters + search
        // ==========================================
        function applyFilters() {
            const cards = document.querySelectorAll('.game-card');
            let visibleCount = 0;
            const query = searchQuery.toLowerCase().trim();

            cards.forEach(card => {
                const tags = card.dataset.tags;
                const searchText = card.dataset.search;

                const matchesFilter = activeFilter === 'alle' || tags.includes(activeFilter);
                const matchesSearch = !query || searchText.includes(query);
                const visible = matchesFilter && matchesSearch;

                if (visible) {
                    card.classList.remove('hiding', 'hidden');
                    visibleCount++;
                } else {
                    card.classList.add('hiding');
                    setTimeout(() => {
                        if (card.classList.contains('hiding')) {
                            card.classList.add('hidden');
                        }
                    }, 250);
                }
            });

            updateResultsCount(visibleCount);
        }

        // ==========================================
        // Results count
        // ==========================================
        function updateResultsCount(count) {
            const el = document.getElementById('resultsCount');
            const filterName = tagLabels[activeFilter] || 'Alle';
            if (activeFilter === 'alle' && !searchQuery) {
                el.innerHTML = `<strong>${count}</strong> Spiele`;
            } else {
                el.innerHTML = `<strong>${count}</strong> ${count === 1 ? 'Spiel' : 'Spiele'} ${activeFilter !== 'alle' ? 'in ' + filterName : ''} ${searchQuery ? 'f\u00fcr "' + searchQuery + '"' : ''}`.trim();
            }
        }

        // ==========================================
        // Launch game with overlay
        // ==========================================
        function launchGame(url, icon, title) {
            const overlay = document.getElementById('launchOverlay');
            document.getElementById('launchIcon').textContent = icon;
            document.getElementById('launchText').textContent = title;
            overlay.classList.add('active');

            setTimeout(() => {
                window.location.href = url;
            }, 500);
        }

        // ==========================================
        // Init
        // ==========================================
        function init() {
            renderFilters();
            renderCards();

            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                applyFilters();
            });

            // Keyboard shortcut: Escape clears search + filter
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    searchInput.value = '';
                    searchQuery = '';
                    activeFilter = 'alle';
                    document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
                    document.querySelector('.filter-pill[data-filter="alle"]').classList.add('active');
                    applyFilters();
                }
                // Focus search on /
                if (e.key === '/' && document.activeElement !== searchInput) {
                    e.preventDefault();
                    searchInput.focus();
                }
            });
        }

        init();
    </script>
